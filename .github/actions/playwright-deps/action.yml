name: Install Playwright OS deps
description: >-
  Install Playwright's apt dependencies with every network failure mode bounded.
  Extracted because three jobs need it (e2e, desktop-smoke, storybook) and the
  third was missed twice — see the notes below.

inputs:
  install-command:
    description: >-
      Command that runs `playwright install-deps`. Callers pass the workspace
      script rather than `bunx playwright`, because bunx resolves a floating
      latest from npm and can install for a different revision than the pinned
      @playwright/test the job actually imports.
    required: true

runs:
  using: composite
  steps:
    # Three layers, each added because the previous one was measured insufficient:
    #
    # 1. The runner's apt sources are `mirror+file:/etc/apt/apt-mirrors.txt`, whose
    #    first entry is the azure.archive.ubuntu.com edge that goes unreachable.
    #    apt does fall through to the canonical archive, but only after minutes of
    #    `Ign:` retries — and those minutes are what consume the budget. Dropping
    #    the flaky edge is the root-cause fix (issue #561).
    # 2. Bounding apt's own Acquire retries/timeouts, so a stalled mirror fails in
    #    seconds (issue #556 diagnosed this; it bounded only the step).
    # 3. Bounding each ATTEMPT, not just the step. A single hung apt run was
    #    observed eating an entire 6-minute step budget, so the retry loop never
    #    reached attempt 2 and the retries bought nothing.
    #
    # Caveat: `timeout` signals the direct child, so a KILLed attempt can leave
    # apt-get holding the dpkg lock; the next attempt then fails *fast* on that
    # lock rather than hanging. That is the behaviour we want, but it means the
    # retry mainly recovers from quick failures — layer 1 prevents the hang.
    - name: Install Playwright OS deps (apt)
      shell: bash
      run: |
        set -euo pipefail
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          if ! grep -q '[^[:space:]]' /etc/apt/apt-mirrors.txt; then
            echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
        fi
        sudo tee /etc/apt/apt.conf.d/99-bounded-retries >/dev/null <<'APTCONF'
        Acquire::Retries "2";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        APTCONF
        # 4. Skip the install entirely when there is nothing to install. On
        #    ubuntu-24.04 every library Playwright asks for is already on the
        #    image (Google Chrome ships preinstalled and depends on the same
        #    set); the transaction's only real work is ~21MB of CJK/Thai/Cyrillic
        #    fonts, and this suite renders en + es. Measured 17-48s per job, in
        #    three jobs. The probe is `ldd` over the cached browser rather than a
        #    hardcoded "it's fine": a runner-image regression that drops a lib
        #    still falls through to the apt path below. No cached browser yet
        #    (cold Playwright cache) also falls through, which is the safe way
        #    round. The apt hardening above still runs unconditionally — the
        #    ffmpeg step in `e2e` inherits it.
        for chrome in "$HOME"/.cache/ms-playwright/chromium*/chrome-linux*/chrome \
                      "$HOME"/.cache/ms-playwright/chromium*/chrome-linux*/headless_shell; do
          [ -x "$chrome" ] || continue
          if ldd "$chrome" 2>/dev/null | grep -q 'not found'; then
            echo "$chrome has unresolved libraries; installing OS deps"
            break
          fi
          echo "Playwright's Chromium resolves every shared library already; skipping apt"
          exit 0
        done

        for attempt in 1 2 3; do
          if timeout --signal=KILL 150 ${{ inputs.install-command }}; then
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            echo "::warning::playwright install-deps failed or timed out (attempt ${attempt}/3); retrying"
            sleep $((attempt * 10))
          fi
        done
        echo "::error::playwright install-deps failed after 3 attempts"
        exit 1
