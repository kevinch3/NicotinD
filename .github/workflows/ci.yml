name: CI & Edge

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  # One group per master COMMIT, not per branch. Sharing one group meant
  # GitHub's single pending slot silently evicted the middle commit of any
  # three, so four master commits in five days ran no CI of their own — two of
  # them `fix:` (issue #906). `cancel-in-progress: false` could not help: it
  # governs the *running* member and has no say over the pending one.
  group: ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  # Every green master commit ships (the `edge` jobs), so master pushes must
  # never cancel each other — a cancelled run is a commit that never reached
  # the host (and, before releases moved to release.yml, a release cancelled
  # out from under itself, issue #360). Only superseded PR pushes cancel.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned, not `latest`: a drifting toolchain makes the dependency cache key below
  # unstable (every bump is a cold install for every job) and makes a green run
  # unreproducible. Bump deliberately.
  BUN_VERSION: '1.3.14'
  # ffmpeg-static's install script skips its GitHub download when this names an
  # existing file. Only desktop-package stages the binary, so it clears this; a
  # stray use elsewhere fails loudly instead of fetching (#1087, quality-gates.md).
  FFMPEG_BIN: /bin/false

# Least privilege by default: a job gets a read-only token unless it declares
# its own `permissions:`, which REPLACES this block rather than adding to it.
permissions:
  contents: read

jobs:
  # Every job skips a `chore(release):` push. That commit only adds generated
  # version files (package.json, CHANGELOG.md, build.gradle, the F-Droid
  # changelogs), and release.yml validates them with check:fdroid BEFORE
  # pushing. Re-running every job on it produced a result nothing waited for:
  # the tag it carries has already started deploy.yml. A pull request has no
  # head_commit, so `|| ''` keeps PR runs unaffected. See docs/releasing.md.

  # Static gates + unit tests. Deliberately holds nothing browser-driven and nothing
  # that takes minutes: this job used to be the workflow's entire critical path (10m09
  # steady-state, 14m16 on a bad run) while every other job finished and idled, because
  # `Test (web)` and the Storybook catalog gates ran serially at the end of it. Those
  # are now `web-test` and `storybook`, running beside this one.
  #
  # Anything added here must be reachable from `bun run verify` — `check:ci-parity`
  # enforces that across every job in its GATE_JOBS list, which this is one of.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    steps:
      # Full history: the secret scan below walks every commit, and a shallow
      # clone would silently shrink what it examines to one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Statically validate the workflow files themselves. A malformed `${{ }}`
      # expression (e.g. a double-quoted string literal) makes a workflow invalid and
      # fails it at startup with zero jobs — invisible until a deploy silently never
      # runs. actionlint turns that into a failed PR check here instead. We download
      # the pinned binary directly rather than use a wrapper action: the popular ones
      # run `npm install` in the repo root, which chokes on this Bun workspace's
      # `workspace:*` deps (EUNSUPPORTEDPROTOCOL). shellcheck is preinstalled on the
      # runner, so actionlint lints inline `run:` scripts too.
      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=rhysd/actionlint
          version=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

      # Scans the FULL history, not the working tree: a secret committed and then
      # deleted inside the same PR is still published forever, and a tree scan
      # cannot see it. ~1.3s for 1,968 commits, because it walks diffs.
      #
      # Pinned binary rather than gitleaks-action, matching the actionlint step
      # above — it also sidesteps that action's licensing terms entirely.
      # Allowlists (with reasons) live in .gitleaks.toml.
      #
      # -v names the rule, file, line and commit of every finding. Without it the
      # log says only "leaks found: N", and because the scan covers every fetched
      # branch the finding is not necessarily on the branch under test (#1160).
      # --redact stays on, so the matched value itself is never printed.
      - name: Secret scan
        run: |
          set -euo pipefail
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --config .gitleaks.toml -v

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      # Also carries the code-shape gates that were regex scripts (#1316):
      # nicotind/shared-helpers and nicotind/search-matching.
      - name: Lint
        run: bun run lint

      # Formatting drift is normally harmless; here it wasn't. The repo had
      # drifted to 218 files, so the documented `bun run format` produced a
      # 218-file diff on top of any real change and could not safely be run
      # (#272). A gate keeps it that way. Fix locally with `bun run format`.
      - name: Format check
        run: bun run format:check

      # CLAUDE.md loads into every request, so a symbol it names that no longer
      # exists is read as ground truth and sends work down a path that isn't
      # there. Renames are the usual source (issue #255).
      - name: Check CLAUDE.md for identifier drift
        run: bun run check:claude-md

      # JSON.parse keeps the LAST duplicate key silently, so a merge resolved by
      # keeping both sides of a conflict can discard a script outright.
      - name: Check JSON configs for duplicate keys
        run: bun run check:json

      # An addon downloading into musicDir made every album land twice -- once
      # organized+transcoded, once as the raw peer folder scanned in place
      # (27.5 GB, #827). This keeps walker #15 from re-deriving the exclusion.
      - name: Check every musicDir walker honours the reserved-path predicate
        run: bun run check:library-walkers
      - name: Transcode callers keep the originals
        run: bun run check:transcode-quarantine

      # Song ids are sha1(path), so a rename, move or re-encode re-mints them --
      # and there are no FKs on song_id, deliberately, so a table nobody carried
      # orphans in silence. #259 lost playlist rows that way; 30% of song-scope
      # genre overrides were found orphaned on prod. The denominator comes from
      # the live schema, so a table added later is covered whether or not anyone
      # remembered the registry.
      - name: Check every song-keyed table is carried or exempt on the record
        run: bun run check:song-carry-coverage

      # `bun:sqlite` is synchronous, so a quadratic list query is an outage, not
      # a slow page (#1055 held the event loop ~3 min) and nothing in this
      # process can pre-empt it. This plans every list route x every filter
      # dimension and fails the correlated shape before it ships.
      - name: Check every library list query evaluates the song predicate once
        run: bun run check:library-queries

      # Every feed used to hand-roll `hidden = 0 AND landed_at IS NOT NULL`, and
      # radio forgot the album's hidden flag. "May this song be recommended" now
      # has one definition; this fails a feed that answers it its own way.
      - name: Check every recommendation feed uses the shared eligibility predicate
        run: bun run check:feed-eligibility

      # A check this job runs that no local command reaches is invisible until
      # push — how the web-spec typecheck drifted. This asserts `bun run verify`
      # still covers every step below.
      - name: Check CI/local gate parity
        run: bun run check:ci-parity

      # An action on a retired Node runtime warns in the run log for a while and
      # then stops working. Nothing reads run-log warnings, so #848 found 14 of
      # 17 actions still on node20 across 67 call sites. Network-free: it floors
      # majors against a table rather than resolving runtimes live.
      - name: Check action runtimes
        run: bun run check:action-runtimes

      # Forgetting the auth middleware makes a route public and nothing else
      # complains — that is how /api/radio and /api/catalog stayed open (#461).
      - name: Check every /api route group decides about auth
        run: bun run check:route-auth

      # F-Droid forbids proprietary deps, and ours arrive transitively:
      # @capacitor/barcode-scanner pulls com.google.mlkit. A new plugin with the
      # same problem would not change the exclusion list, so this fails on an
      # UNCLASSIFIED plugin too, and on a release step pointing at a gradle
      # output path the `distribution` flavor does not produce (#1168).
      - name: F-Droid build variant gate
        run: bun run check:fdroid

      # electron-builder's publisher skipped every upload and exited 0 through ~40
      # releases that shipped no desktop artifact and no updater feed (#1261), and
      # later, unable to see the draft release, published a second desktop-only
      # one (v0.8.103). This fails a packaging job that lets electron-builder
      # publish, or whose upload-by-id or post-upload verification was dropped,
      # reordered, or made continue-on-error — the wiring, not the mechanism.
      - name: Desktop publish gate (a packaging job must verify what it uploaded)
        run: bun run check:desktop-publish

      # Every outbound fetch must carry an abort signal. Both house clients
      # shipped without one (#623, #625) and the failure mode is silence: a
      # missing timeout looks exactly like a working call until an upstream
      # stops answering.
      - name: Fetch timeout gate
        run: bun run check:fetch-timeouts

      # Fails only on an advisory that is BOTH in the production closure and a
      # match for the resolved version. Raw `bun audit` reports 95 advisories
      # here, nearly all against build-toolchain packages that never ship or
      # against a second, dev-only resolution of a package whose shipping copy
      # is fine. Written as the script, never raw `bun audit`, so
      # `check:ci-parity` matches on a name instead of a drifting flag list.
      - name: Supply-chain gate (what actually ships)
        run: bun run check:audit

      # Fails on a dependency whose install hook nobody has reviewed. Such a hook
      # can download from a vendor's own host, which puts a third party's uptime
      # in front of every job's `bun install` — ffmpeg-static failed `web-test` on
      # a release commit that way (#1087), and sharp@0.32.6 failed `web-test`,
      # both `e2e-shard` legs and `desktop-package` at once on 2026-09-21. Runs
      # here rather than in its own job because it reads the tree `bun install`
      # just built, which every gate job has already.
      - name: Install-script gate (no unreviewed third-party downloads)
        run: bun run check:install-scripts

      # Every format an operator can standardize their library on must be a
      # valid choice: scannable, taggable, with a calibrated ladder and a
      # declared art/gain capability. The failure this prevents is silent and
      # total — adopting the streaming table's `aac` entry (`-f adts`, `.aac`)
      # as a library target gives a library the scanner indexes and
      # `writeAudioTags` refuses every write to, forever (#1256).
      - name: Library format gate (every choice must be valid)
        run: bun run check:library-formats

      # Without these, 55 `describe.if(ffmpegAvailable())` blocks across 15 files
      # SKIP here and print the same green as a pass. This job reported
      # `136 skip / 0 fail` on #1267 while skipping the very regression test for
      # the bug that PR fixed. The whole transcode / artwork / tagging / loudness
      # surface was unverified — every defect the Opus conversion paid to find
      # (#1225, #1230, #1249, #1251, #1252, #1177) has a regression test, and none
      # of them ran (#1268).
      #
      # Two true statements that never met: this job runs the bun:test suite but
      # had no ffmpeg, and `e2e-shard` has ffmpeg but runs Playwright specs only.
      # A comment in `post-download-transcode.test.ts` asserted the `e2e` job
      # exercised them; it does not, and that claim is corrected there.
      #
      # `opus-tools` is separate from ffmpeg and equally required: `opusinfo` is
      # the independent second reader `opus-artwork.test.ts` uses deliberately,
      # because checking a file only with the same library the app reads it with
      # cannot distinguish "written wrong" from "read wrong" (#1226).
      #
      # `--no-install-recommends` for the reason `e2e-shard` gives: it drops ~100
      # packages (VA/VDPAU drivers, SDL2, PulseAudio) no decode path reaches.
      - name: Install ffmpeg and opus-tools (so the gated tests actually run)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg opus-tools

      - name: Test (API + core + addon-sdk + mobile + desktop + scripts)
        run: bun test packages/api/src packages/core/src packages/addon-sdk/src packages/mobile/src packages/desktop/electron packages/desktop/scripts scripts

      - name: Test (e2e playground helpers)
        run: bun test packages/e2e/playground

  # Split out of `ci` (see the header comment there). 135s of vitest shares nothing
  # with the type/lint gates, so it runs beside them rather than after them.
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Test (web)
        run: bun run --filter @nicotind/web test

  # Also split out of `ci`: the Storybook catalog gates are browser-driven and were the
  # slowest half of that job (build + browser install + smoke + axe). They need only
  # `packages/web/storybook-static`, never the `ng build` dist, so this job does not
  # build the web app — `e2e`, `desktop-package` and `desktop-smoke` each still do.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Build (Storybook)
        run: bun run build:storybook

      # Browsers are a ~170MB download; `setup-bun` obviously does not cache them and
      # nothing else did either, so this step ran cold in every browser job. It spiked
      # to 4m24 on one run against a 22s norm. Keyed on the lockfile, which is what
      # changes when the pinned @playwright/test moves.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Runs through the e2e package script so `playwright` resolves to that workspace's
      # pinned binary. `bunx playwright` resolves a floating latest from npm and can
      # install browsers for a different revision than the @playwright/test the gate
      # script imports; the root node_modules/.bin has no playwright at all under bun's
      # isolated install.
      - name: Install Playwright OS deps
        uses: ./.github/actions/playwright-deps
        with:
          install-command: bun run --filter @nicotind/e2e install:deps

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: bun run --filter @nicotind/e2e install:browsers

      # `build:storybook` compiles stories; it does not run them. The first green build
      # of the catalog shipped 67 of 139 stories that threw on mount, which neither the
      # type check nor webpack can see. This renders every story and runs axe over it in
      # the same traversal — see packages/e2e/scripts/storybook-gates.mjs.
      - name: Storybook gates (render smoke + axe)
        run: bun run gates:storybook

  # Analysis sidecar (packages/analysis): contract + pure-function tests against
  # a fake model registry — no TensorFlow/Essentia download in CI. The gated
  # golden tests (real models) auto-skip without ANALYSIS_MODELS_DIR.
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install (dev extras only)
        run: pip install -e './packages/analysis[dev]'

      - name: Lint (ruff)
        run: ruff check packages/analysis/app packages/analysis/tests

      - name: Test (pytest)
        run: pytest packages/analysis/tests -q

  # Sharded across four runners. The suite is 172 tests over ~50 files against ONE
  # server and ONE SQLite DB, so `workers: 1` inside a shard is still mandatory
  # (docs/e2e.md) — but a shard is its own checkout, DB and server pair, so the
  # files can be split. Playwright shards whole files in alphabetical blocks, which
  # is why a spec that reads another spec's leftovers had to be fixed first.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    strategy:
      # A failing shard must not cancel the others: knowing which three passed is
      # what tells you whether a failure is local to one block or systemic.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      # See the note in the `storybook` job: the browser download was uncached in every
      # job that needed one.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright OS deps
        uses: ./.github/actions/playwright-deps
        with:
          install-command: bun run --filter @nicotind/e2e install:deps

      # Browser binary only — no apt, and served by the cache above on a hit.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: bun run --filter @nicotind/e2e install:browsers

      - name: Build (web)
        run: bun run --filter @nicotind/web build

      # The TV route tree is a build-time fork (`environment.tvBuild`), so the
      # `tv` project serves a second bundle through NICOTIND_WEB_DIST (#1136).
      # Same reason as the step above: E2E_SKIP_BUILD below skips ensureWebBuild()
      # for both bundles, so both are built once here. `--output-path` is a string
      # override of angular.json's object outputPath, hence `dist-tv/browser`.
      - name: Build (web, TV configuration)
        run: bun run --filter @nicotind/web build -- --configuration tv --output-path dist-tv

      # ffmpeg: the waveform artifact (`GET /api/peaks/:id`, issue #643) decodes
      # the fixture on demand and its e2e asserts the real strip — skipping that
      # test where ffmpeg is absent would leave the feature a permanently silent
      # gate (the #457 shape). The transcode / vocal-mute branches become real
      # here as a by-product; they were written to pass either way.
      # The update is NOT redundant any more: the deps step above now short-circuits
      # without touching apt, so this is the job's only refresh and the image's
      # shipped lists are stale — measured, installing without it 404s on
      # libssh-gcrypt (the issue #730 mode) and costs 20s before failing over.
      # `--no-install-recommends` drops ~100 packages (VA/VDPAU drivers, SDL2,
      # PulseAudio, pocketsphinx) that no decode-to-Opus path reaches.
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # E2E_SKIP_BUILD: `Build (web)` above already produced the dist from this
      # checkout, but ensureWebBuild() has no freshness check, so every run paid a
      # SECOND full Angular build — cold both times, since Angular disables its
      # disk cache whenever CI is set.
      - name: Run e2e (shard ${{ matrix.shard }}/4)
        run: bun run --filter @nicotind/e2e test -- --shard=${{ matrix.shard }}/4
        env:
          CI: '1'
          E2E_SKIP_BUILD: '1'

      # Per-shard name: four shards uploading one artifact name collides and the
      # upload fails, losing the report for the shard you actually need.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/e2e/playwright-report/
          retention-days: 7

  # The one context named `e2e`, which the `Protect master` ruleset requires by
  # name (issue #908). Sharding replaced that context with `e2e (1..4)`, so the
  # required check stopped existing and every PR sat at BLOCKED with a fully
  # green list. Aggregating here keeps the ruleset stable across future shard
  # count changes; requiring `e2e (1)..(4)` instead would hardcode the count into
  # branch protection and break again the moment it moves.
  #
  # `if: always()` is load-bearing. Without it this job is SKIPPED when a shard
  # fails, the context never reports, and the failure mode is identical to the
  # one it exists to fix — a required check that silently never arrives.
  e2e:
    needs: [e2e-shard]
    if: "always() && !startsWith(github.event.head_commit.message || '', 'chore(release):')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          # `result` on a matrix job is the rollup: 'success' only when every
          # shard succeeded, otherwise failure/cancelled/skipped.
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e-shard rollup: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::e2e shards did not all pass (rollup: $SHARDS)"
            exit 1
          fi

  # Packaged-boot smoke test (Task 13): launches the real Electron app via
  # Playwright's `_electron` and asserts the window loads + the sidecar
  # backend answers. Best-effort — `_electron` + a headless Linux display is
  # heavier/flakier than the browser-driven `e2e` job above, so it must not
  # block what ships (`edge-image`). NOT in its `needs` for the same reason.
  # Desktop packaging IS deterministic (unlike the flaky Electron-launch smoke
  # test below), so it's a real blocking gate — and it's the only PR-time check
  # that runs `prepare-resources`'s production backend staging, which
  # deploy.yml's desktop-linux/mac jobs run but nothing here did. A type-only
  # workspace dep left in a staged package's `dependencies` broke that staging
  # on v0.2.0 while every PR check stayed green; this stops that class of
  # regression reaching a release.
  desktop-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    env:
      FFMPEG_BIN: ''
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      # The ONLY job that installs with `FFMPEG_BIN: ''`, so it is the only one whose
      # `bun install` downloads a binary from a host that is not the npm registry — it
      # needs the real ffmpeg to package the app, so #1087's removal is not available
      # here. That download returned 504 on 2026-09-21 and withheld a four-file artwork
      # fix; retrying it is the honest remedy, because a vendor CDN's uptime is not a
      # signal about the diff. Bounded and loud: three attempts, then the job fails —
      # never a `|| true`, which would land a release with resources staged from a
      # half-installed tree. `check:install-scripts` is what keeps this narrow, by
      # failing if a SECOND package starts downloading.
      - name: Install dependencies (bounded retry — third-party binary download)
        run: |
          for attempt in 1 2 3; do
            if bun install; then exit 0; fi
            echo "::warning::bun install failed (attempt ${attempt}/3); retrying"
            sleep $((attempt * 10))
          done
          echo "::error::bun install failed 3 times — not a transient download failure"
          exit 1
      - name: Build web (prepare-resources stages the dist)
        run: bun run --filter @nicotind/web build
      - name: Stage desktop resources (production backend install)
        run: bun run --filter @nicotind/desktop prepare-resources

  desktop-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      # The smoke test's sidecar boots in dev mode straight off
      # packages/web/dist (see electron/paths.ts) — no packaged resources/
      # staging needed, just the raw web build.
      - name: Build web
        run: bun run --filter @nicotind/web build

      - name: Build desktop main/preload
        run: bun run --filter @nicotind/desktop build

      # Playwright's `--with-deps` pulls the OS shared libraries Electron's
      # bundled Chromium also needs (libnss3, libatk, …). We deliberately do
      # NOT probe with `electron --version`: that *launches* the Electron
      # binary, which aborts on a GitHub runner because Chromium's SUID
      # sandbox helper isn't root-owned. The binary itself is already present
      # (electron's postinstall ran during `bun install`); the smoke test
      # launches it with `--no-sandbox` in CI (see smoke.spec.ts).
      # See the note in the `storybook` job: the browser download was uncached in every
      # job that needed one.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright OS deps
        uses: ./.github/actions/playwright-deps
        with:
          install-command: bun run --filter @nicotind/desktop install:deps

      # Browser binary only — no apt, and served by the cache above on a hit.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: bun run --filter @nicotind/desktop install:browsers

      - name: Run desktop smoke test
        run: xvfb-run -a bun run --filter @nicotind/desktop test:smoke
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-smoke-report
          path: packages/desktop/playwright-report/
          retention-days: 7

  # Container packaging checks. Compose lint always runs (seconds); the full
  # image build runs only when a container input changed — it's the CI proof
  # for Dockerfile edits, so deploy.yml's tag-time GHCR publish isn't the first
  # time a broken image build is discovered. The amd64 GHA cache scope matches
  # deploy.yml's, so a master-push build here warms the release build's cache.
  #
  # Matrixed over both published arches, mirroring deploy.yml. Building amd64
  # only meant an arm64-only break surfaced at RELEASE time, after the tag was
  # cut — the same class of gap #620 closed for "CI never boots what ships", and
  # arm64 self-hosters (Pi, Apple Silicon, Ampere) are a real audience for a
  # public image.
  #
  # Native runners, never QEMU: deploy.yml records the reason — Bun's JIT is
  # unreliable under emulation, so a QEMU-based check would be flaky, and a
  # flaky gate is worse than none. `load: true` cannot take a multi-platform
  # build (the docker exporter cannot export a manifest list), which is why this
  # is a matrix rather than a `platforms:` list on one step.
  #
  # `edge-image.needs` lists `docker` by job id, and a matrix requires every leg to
  # pass, so the gate stays wired without touching `needs`.
  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message || '', 'chore(release):')"
    strategy:
      # Both arches should report; one failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the diff base below always resolves

      # linux/amd64 -> linux-amd64, for the cache scope. Same slug deploy.yml uses.
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # Arch-independent, so one leg is enough — running it twice would just
      # double the noise on a failure.
      - name: Validate compose files
        if: matrix.platform == 'linux/amd64'
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.streaming-only.yml config -q

      # `paths:` filters can't express "job runs always, one step conditionally",
      # so diff explicitly against the push's or PR's base.
      #
      # Only the ANALYSIS image is gated this way now. The main image builds on
      # every run: the point of the smoke step below is to catch a change that
      # breaks the artifact we ship, and those are overwhelmingly source changes,
      # which this filter deliberately ignores. Measured cost with a warm GHA
      # cache: ~3 min, against an e2e job of ~5 min running in parallel — so the
      # workflow's critical path does not move.
      - name: Detect analysis-image changes
        id: f
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Unresolvable base (first push, force-push over history): build.
          #
          # This used to set `build=true` and `exit 0` — returning BEFORE
          # `analysis` was written, so the analysis build silently skipped in the
          # one case the comment called a safe default. With `build` gone the
          # early return goes too, and the fallback is now actually safe.
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "analysis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base"...HEAD)"
          if echo "$files" | grep -qE '^(packages/analysis/(Dockerfile|\.dockerignore|pyproject\.toml)$|packages/analysis/app/|\.github/workflows/(ci|deploy)\.yml$)'; then
            echo "analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "analysis=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (${{ matrix.platform }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # `load` puts the result in the local daemon so the smoke step can
          # actually run it. Without it the image exists only in the build cache
          # and `docker run` has nothing to start.
          load: true
          tags: nicotind:ci
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      # Nothing in CI had ever STARTED the artifact that ships. The e2e job runs
      # `bun run src/main.ts` from the working tree, and this job used to build an
      # image and throw it away — so a broken runtime stage (a missing file in the
      # COPY set, a bad CMD, a dependency pruned from the production install)
      # reached the deploy host before anyone found out.
      #
      # Waits on the image's OWN HEALTHCHECK rather than a hand-rolled poll, so
      # this exercises the same mechanism compose and the deploy host rely on.
      - name: Smoke — boot the built image and verify it serves
        # Same script deploy.yml runs against the image a release pushes.
        run: bash scripts/smoke-image.sh nicotind:ci "$(jq -r .version package.json)"

      - name: Smoke — container logs on failure
        if: failure()
        run: docker logs nicotind-smoke 2>&1 | tail -100 || true

      - name: Smoke — clean up
        if: always()
        run: docker rm -f nicotind-smoke 2>/dev/null || true

      # Same idea for the analysis sidecar image published by deploy.yml's
      # docker-analysis job (its Python deps/tests are covered by the
      # `analysis` job above — this checks the image still builds).
      # amd64 only, and not because of this matrix: essentia-tensorflow ships
      # x86_64-only wheels, so an arm64 analysis build has never been possible.
      - name: Build analysis image (amd64, no push)
        if: matrix.platform == 'linux/amd64' && steps.f.outputs.analysis == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packages/analysis
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=analysis-linux-amd64
          cache-to: type=gha,mode=max,scope=analysis-linux-amd64

  # ---------------------------------------------------------------------------
  # EDGE: every green master commit becomes `ghcr.io/kevinch3/nicotind:edge` and
  # goes onto the deploy host (docs/releasing.md "Edge and releases"). Public
  # releases are cut separately, on a schedule, by release.yml.
  #
  # This is what ships from every merge now, so it is what every gate job must
  # block: `check:ci-parity` compares THIS job's needs to its GATE_JOBS, both
  # ways. It rebuilds instead of reusing the `docker` job's image because that
  # job also runs pull-request code, and must never hold a token that can push.
  # ---------------------------------------------------------------------------
  edge-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [ci, web-test, storybook, e2e, e2e-shard, analysis, docker, desktop-package]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message || '', 'chore(release):')"
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/kevinch3/nicotind
    steps:
      - uses: actions/checkout@v7

      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same cache scope as the `docker` job above, which built this exact tree
      # minutes ago, so this is mostly cache hits. NICOTIND_BUILD_COMMIT is what
      # the host's /api/health reports, and what the edge deploy verifies.
      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            NICOTIND_BUILD_COMMIT=${{ github.sha }}
            APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Smoke — boot the pushed image and verify it serves
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          bash scripts/smoke-image.sh "$ref" "$(jq -r .version package.json)"

      - name: Smoke — container logs on failure
        if: failure()
        run: docker logs nicotind-smoke 2>&1 | tail -100 || true

      - name: Smoke — clean up
        if: always()
        run: docker rm -f nicotind-smoke 2>/dev/null || true

      # The same scan, policy and pin as a release's (deploy.yml `docker-merge`),
      # on each arch's pushed digest: a finding fails this job, so `:edge` never
      # moves to the image and the host deploy is never dispatched
      # (docs/releasing.md "Edge and releases").
      - name: Scan the pushed image for OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          vuln-type: os
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: edge-digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into `:edge`, give the analysis sidecar a
  # scanned `:edge` too (compose runs both off one NICOTIND_VERSION), then hand the host
  # this exact commit. The host verifies it by the commit /api/health reports,
  # since an edge build still carries the last release's version number.
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [edge-image]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message || '', 'chore(release):')"
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      IMAGE: ghcr.io/kevinch3/nicotind
      ANALYSIS: ghcr.io/kevinch3/nicotind-analysis
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + history, for the analysis diff below

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: edge-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The analysis image is heavy and changes rarely, so it is rebuilt only
      # when its sources changed since the last release; otherwise that
      # release's image IS this tree's, and `edge` is pointed at it.
      #
      # "The last release" is the newest v* tag whose analysis image EXISTS, not
      # the newest tag: a tag whose build never ran has none (v0.8.104's
      # Build & Deploy was a startup_failure), and retagging from it failed the
      # first edge deploy.
      - name: Analysis image changed since the last release?
        id: analysis
        run: |
          set -euo pipefail
          prev=""
          for t in $(git tag --merged HEAD --list 'v*' --sort=-v:refname | head -n 20); do
            if docker buildx imagetools inspect "$ANALYSIS:$t" >/dev/null 2>&1; then prev="$t"; break; fi
            echo "::notice::$ANALYSIS:$t does not exist; trying an older release"
          done
          if [ -z "$prev" ]; then
            echo "::error::No analysis image among the 20 newest v* tags; cannot seed $ANALYSIS:edge." >&2
            exit 1
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$prev"..HEAD | grep -qE '^packages/analysis/(Dockerfile|\.dockerignore|pyproject\.toml|app/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushed by digest, not as `edge`: the tag moves only after the scan below.
      - name: Build + push the analysis image by digest
        id: analysis-build
        if: steps.analysis.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packages/analysis
          platforms: linux/amd64
          outputs: type=image,name=${{ env.ANALYSIS }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha,scope=analysis-linux-amd64

      - name: Pick the analysis image edge will point at
        id: analysis-ref
        env:
          BUILT: ${{ steps.analysis-build.outputs.digest }}
          PREV: ${{ steps.analysis.outputs.prev }}
        run: |
          if [ -n "$BUILT" ]; then echo "ref=$ANALYSIS@$BUILT"; else echo "ref=$ANALYSIS:$PREV"; fi >> "$GITHUB_OUTPUT"

      # Scanned even when it is the last release's image: a fix published since
      # that release is a finding now (same scan as edge-image's).
      - name: Scan the analysis image for OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.analysis-ref.outputs.ref }}
          vuln-type: os
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      # Both edge tags move only once both images passed their scans, so a
      # finding in either leaves the pair where it was.
      - name: Point edge at this commit
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:edge" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:edge"

      - name: Point the analysis edge at it
        env:
          REF: ${{ steps.analysis-ref.outputs.ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "$ANALYSIS:edge" "$REF"
          docker buildx imagetools inspect "$ANALYSIS:edge"

      # A dispatch, not a call: deploy-host.yml queues host deploys on its own
      # group, and a newer edge commit simply deploys after this one. Honours
      # DEPLOY_HOLD (force=false).
      - name: Deploy this commit to the host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-host.yml --ref master \
            -f version=edge -f ref=${{ github.sha }} -f expect_commit=${{ github.sha }} -f force=false
