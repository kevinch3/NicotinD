name: CI & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # The release job pushes a version-bump commit to master, which triggers a
  # new run in this same group — cancelling THIS run (the one that just
  # produced the release) out from under itself (issue #360). master pushes
  # must never cancel each other; only superseded PR pushes should.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned, not `latest`: a drifting toolchain makes the dependency cache key below
  # unstable (every bump is a cold install for every job) and makes a green run
  # unreproducible. Bump deliberately.
  BUN_VERSION: '1.3.11'

jobs:
  # Static gates + unit tests. Deliberately holds nothing browser-driven and nothing
  # that takes minutes: this job used to be the workflow's entire critical path (10m09
  # steady-state, 14m16 on a bad run) while every other job finished and idled, because
  # `Test (web)` and the Storybook catalog gates ran serially at the end of it. Those
  # are now `web-test` and `storybook`, running beside this one.
  #
  # Anything added here must be reachable from `bun run verify` — `check:ci-parity`
  # enforces that across every job in its GATE_JOBS list, which this is one of.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Statically validate the workflow files themselves. A malformed `${{ }}`
      # expression (e.g. a double-quoted string literal) makes a workflow invalid and
      # fails it at startup with zero jobs — invisible until a deploy silently never
      # runs. actionlint turns that into a failed PR check here instead. We download
      # the pinned binary directly rather than use a wrapper action: the popular ones
      # run `npm install` in the repo root, which chokes on this Bun workspace's
      # `workspace:*` deps (EUNSUPPORTEDPROTOCOL). shellcheck is preinstalled on the
      # runner, so actionlint lints inline `run:` scripts too.
      - name: Lint GitHub Actions workflows
        run: |
          set -euo pipefail
          version=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Formatting drift is normally harmless; here it wasn't. The repo had
      # drifted to 218 files, so the documented `bun run format` produced a
      # 218-file diff on top of any real change and could not safely be run
      # (#272). A gate keeps it that way. Fix locally with `bun run format`.
      - name: Format check
        run: bun run format:check

      # CLAUDE.md loads into every request, so a symbol it names that no longer
      # exists is read as ground truth and sends work down a path that isn't
      # there. Renames are the usual source (issue #255).
      - name: Check CLAUDE.md for identifier drift
        run: bun run check:claude-md

      # JSON.parse keeps the LAST duplicate key silently, so a merge resolved by
      # keeping both sides of a conflict can discard a script outright.
      - name: Check JSON configs for duplicate keys
        run: bun run check:json

      # A copy-pasted helper drifts silently: one expandHome copy returned '' for
      # every absolute path, so a documented CLI gate never ran in Docker (#301).
      - name: Check for locally re-implemented shared helpers
        run: bun run check:shared-helpers

      # A check this job runs that no local command reaches is invisible until
      # push — how the web-spec typecheck drifted. This asserts `bun run verify`
      # still covers every step below.
      - name: Check CI/local gate parity
        run: bun run check:ci-parity

      # Forgetting the auth middleware makes a route public and nothing else
      # complains — that is how /api/radio and /api/catalog stayed open (#461).
      - name: Check every /api route group decides about auth
        run: bun run check:route-auth

      - name: Test (API + slskd-client + lidarr-client + core + service-manager + mobile)
        run: bun test packages/api/src packages/lidarr-client/src packages/core/src packages/addon-sdk/src packages/service-manager/src packages/mobile/src packages/desktop/electron packages/desktop/scripts scripts

      - name: Test (e2e playground helpers)
        run: bun test packages/e2e/playground

  # Split out of `ci` (see the header comment there). 135s of vitest shares nothing
  # with the type/lint gates, so it runs beside them rather than after them.
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Test (web)
        run: bun run --filter @nicotind/web test

  # Also split out of `ci`: the Storybook catalog gates are browser-driven and were the
  # slowest half of that job (build + browser install + smoke + axe). They need only
  # `packages/web/storybook-static`, never the `ng build` dist, so this job does not
  # build the web app — `e2e`, `desktop-package` and `desktop-smoke` each still do.
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Build (Storybook)
        run: bun run build:storybook

      # Browsers are a ~170MB download; `setup-bun` obviously does not cache them and
      # nothing else did either, so this step ran cold in every browser job. It spiked
      # to 4m24 on one run against a 22s norm. Keyed on the lockfile, which is what
      # changes when the pinned @playwright/test moves.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Runs through the e2e package script so `playwright` resolves to that workspace's
      # pinned binary. `bunx playwright` resolves a floating latest from npm and can
      # install browsers for a different revision than the @playwright/test the gate
      # script imports; the root node_modules/.bin has no playwright at all under bun's
      # isolated install.
      - name: Install Playwright Chromium
        run: bun run --filter @nicotind/e2e install:browsers

      # `build:storybook` compiles stories; it does not run them. The first green build
      # of the catalog shipped 67 of 139 stories that threw on mount, which neither the
      # type check nor webpack can see. This renders every story and runs axe over it in
      # the same traversal — see packages/e2e/scripts/storybook-gates.mjs.
      - name: Storybook gates (render smoke + axe)
        run: bun run gates:storybook

  # Analysis sidecar (packages/analysis): contract + pure-function tests against
  # a fake model registry — no TensorFlow/Essentia download in CI. The gated
  # golden tests (real models) auto-skip without ANALYSIS_MODELS_DIR.
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install (dev extras only)
        run: pip install -e './packages/analysis[dev]'

      - name: Lint (ruff)
        run: ruff check packages/analysis/app packages/analysis/tests

      - name: Test (pytest)
        run: pytest packages/analysis/tests -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      # See the note in the `storybook` job: the browser download was uncached in every
      # job that needed one.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # --with-deps runs apt-get, whose mirror retries have no bound of their
      # own — an unreachable Azure mirror once blocked this step silently for
      # hours (issue #556). A healthy run takes ~2m30s; fail fast instead.
      - name: Install Playwright browser
        timeout-minutes: 10
        run: bunx playwright install --with-deps chromium
        working-directory: packages/e2e

      - name: Build (web)
        run: bun run --filter @nicotind/web build

      - name: Run e2e
        run: bun run --filter @nicotind/e2e test
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7

  # Packaged-boot smoke test (Task 13): launches the real Electron app via
  # Playwright's `_electron` and asserts the window loads + the sidecar
  # backend answers. Best-effort — `_electron` + a headless Linux display is
  # heavier/flakier than the browser-driven `e2e` job above, so it must not
  # block `release`. NOT in `needs` below for the same reason.
  # Desktop packaging IS deterministic (unlike the flaky Electron-launch smoke
  # test below), so it's a real blocking gate — and it's the only PR-time check
  # that runs `prepare-resources`'s production backend staging, which
  # deploy.yml's desktop-linux/mac jobs run but nothing here did. A type-only
  # workspace dep left in a staged package's `dependencies` broke that staging
  # on v0.2.0 while every PR check stayed green; this stops that class of
  # regression reaching a release.
  desktop-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: bun install
      - name: Build web (prepare-resources stages the dist)
        run: bun run --filter @nicotind/web build
      - name: Stage desktop resources (production backend install)
        run: bun run --filter @nicotind/desktop prepare-resources

  desktop-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      # The smoke test's sidecar boots in dev mode straight off
      # packages/web/dist (see electron/paths.ts) — no packaged resources/
      # staging needed, just the raw web build.
      - name: Build web
        run: bun run --filter @nicotind/web build

      - name: Build desktop main/preload
        run: bun run --filter @nicotind/desktop build

      # Playwright's `--with-deps` pulls the OS shared libraries Electron's
      # bundled Chromium also needs (libnss3, libatk, …). We deliberately do
      # NOT probe with `electron --version`: that *launches* the Electron
      # binary, which aborts on a GitHub runner because Chromium's SUID
      # sandbox helper isn't root-owned. The binary itself is already present
      # (electron's postinstall ran during `bun install`); the smoke test
      # launches it with `--no-sandbox` in CI (see smoke.spec.ts).
      # See the note in the `storybook` job: the browser download was uncached in every
      # job that needed one.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Same apt-mirror hang bound as the e2e job's install (issue #556).
      - name: Install Playwright OS deps
        timeout-minutes: 10
        run: bunx playwright install --with-deps chromium
        working-directory: packages/desktop

      - name: Run desktop smoke test
        run: xvfb-run -a bun run --filter @nicotind/desktop test:smoke
        env:
          CI: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-report
          path: packages/desktop/playwright-report/
          retention-days: 7

  # Container packaging checks. Compose lint always runs (seconds); the full
  # image build runs only when a container input changed — it's the CI proof
  # for Dockerfile edits, so deploy.yml's tag-time GHCR publish isn't the first
  # time a broken image build is discovered. The amd64 GHA cache scope matches
  # deploy.yml's, so a master-push build here warms the release build's cache.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff base below always resolves

      - name: Validate compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.override.example.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.streaming-only.yml config -q

      # `paths:` filters can't express "job runs always, one step conditionally",
      # so diff explicitly (same approach as deploy.yml's `changes` job).
      - name: Detect container-input changes
        id: f
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # Unresolvable base (first push, force-push over history): build (safe default).
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base"...HEAD)"
          if echo "$files" | grep -qE '^(Dockerfile|\.dockerignore|docker-compose.*\.yml|\.github/workflows/(ci|deploy)\.yml)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$files" | grep -qE '^(packages/analysis/(Dockerfile|pyproject\.toml)|\.github/workflows/(ci|deploy)\.yml)$'; then
            echo "analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "analysis=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.f.outputs.build == 'true' || steps.f.outputs.analysis == 'true'

      - name: Build image (amd64, no push)
        if: steps.f.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-linux-amd64
          cache-to: type=gha,mode=max,scope=docker-linux-amd64

      # Same idea for the analysis sidecar image published by deploy.yml's
      # docker-analysis job (its Python deps/tests are covered by the
      # `analysis` job above — this checks the image still builds).
      - name: Build analysis image (amd64, no push)
        if: steps.f.outputs.analysis == 'true'
        uses: docker/build-push-action@v6
        with:
          context: packages/analysis
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=analysis-linux-amd64
          cache-to: type=gha,mode=max,scope=analysis-linux-amd64

  release:
    runs-on: ubuntu-latest
    needs: [ci, web-test, storybook, e2e, analysis, docker, desktop-package]
    if: "github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Idempotent, self-healing, orphan-tag-proof release.
      #
      # The failure this guards against (seen 2026-07-23, wedged every release
      # for a day): the old step pushed with `git push --follow-tags`, which is
      # NON-ATOMIC. When a concurrent merge advanced master, the branch update
      # was rejected non-fast-forward but the *tag* still landed — leaving an
      # orphan `vX` tag pointing at a `chore(release)` commit that never reached
      # master. From then on the dry-run kept proposing that same version, and
      # the old `tag exists → skip` guard read the orphan as "already published"
      # and silently exited 0 (green!) on every subsequent push. No new tag → no
      # deploy.yml run → releases frozen, invisibly.
      #
      # Two independent defenses, either of which alone prevents recurrence:
      #   1. `--atomic`: a rejected branch push no longer lets the tag through.
      #   2. self-heal: a `vX` tag that is NOT an ancestor of master is treated
      #      as the orphan it is — deleted and re-cut from real master, instead
      #      of masking the freeze as a skip. (This also auto-repairs the
      #      existing orphan on the first master run after this lands.)
      # Plus a bounded retry that re-syncs to the real tip so a merge racing the
      # release is retried, never orphaned.
      - name: Release (idempotent, self-healing bump + tag + atomic push)
        run: |
          set -euo pipefail

          attempt=0
          max=4
          while :; do
            attempt=$((attempt + 1))

            # Always cut the release on top of the true remote tip so the push
            # is a fast-forward; also refresh tags for the orphan check below.
            git fetch --tags --force origin master
            git reset --hard FETCH_HEAD # HEAD now == remote master tip

            version="$(bunx commit-and-tag-version --dry-run 2>&1 \
              | grep -oP 'tagging release v\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            if [ -z "$version" ]; then
              echo "Could not determine next version from dry-run output" >&2
              exit 1
            fi
            tag="v$version"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if git merge-base --is-ancestor "$tag^{commit}" HEAD; then
                echo "$tag already reachable from master — genuinely published, skipping."
                exit 0
              fi
              # Tag exists but is not on master: a stale orphan from a
              # half-failed push. Delete it and re-release from real master.
              echo "::warning::$tag is an orphan tag (not an ancestor of master); deleting and re-releasing."
              git push --delete origin "$tag" || true
              git tag -d "$tag" || true
            fi

            bun run release

            # --atomic: if the branch update is rejected (a merge raced us) the
            # tag is rejected too, so a failed push can never orphan a tag again.
            if git push --atomic --follow-tags origin HEAD:refs/heads/master; then
              echo "Published $tag."
              exit 0
            fi

            # Roll back the local tag so the retry re-cuts cleanly on the new tip.
            git tag -d "$tag" || true
            if [ "$attempt" -ge "$max" ]; then
              echo "Release push still rejected after $max attempts." >&2
              exit 1
            fi
            echo "Push rejected (master advanced); re-syncing and retrying ($attempt/$max)…" >&2
            sleep "$((attempt * 3))"
          done
