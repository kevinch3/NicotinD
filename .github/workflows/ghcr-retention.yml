name: GHCR retention

# Prunes untagged image versions nothing references (#1461): every green master
# commit pushes per-arch images by digest and re-points `:edge`, and nothing else
# ever removes them. scripts/ghcr-retention.ts keeps every digest a tag reaches
# through its manifest list, so the per-arch and attestation manifests behind
# `:edge`, `release` and each `vX.Y.Z` survive (docs/releasing.md "GHCR retention").
#
# Reports only, unless told to delete: a manual run with `delete` ticked, or a
# scheduled run once the repository variable GHCR_RETENTION_DELETE is `true`.
# Deleting is master-only either way.

on:
  schedule:
    # Mondays 05:43 UTC, off the hour.
    - cron: '43 5 * * 1'
  workflow_dispatch:
    inputs:
      delete:
        description: Actually delete (unticked = dry run, only lists what it would delete)
        type: boolean
        default: false
      min_age_days:
        description: Keep untagged versions younger than this many days
        type: number
        default: 14

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned to match ci.yml — see the note there.
  BUN_VERSION: '1.3.14'

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ghcr-retention
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # No `bun install`: the script uses only fetch and Bun built-ins.
      - name: Prune untagged, unreferenced versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELETE: ${{ github.ref == 'refs/heads/master' && ((github.event_name == 'workflow_dispatch' && inputs.delete) || (github.event_name == 'schedule' && vars.GHCR_RETENTION_DELETE == 'true')) }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || 14 }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          args=(--owner "$OWNER" --package nicotind --package nicotind-analysis --min-age-days "$MIN_AGE_DAYS")
          if [ "$DELETE" = "true" ]; then args+=(--delete); fi
          bun run scripts/ghcr-retention.ts "${args[@]}"
