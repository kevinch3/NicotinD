name: Pages

# GitHub Pages serves our signed F-Droid repository at /fdroid/repo/, plus a
# landing page. The Storybook catalog was published here too until it was
# dropped (docs/storybook.md "Publishing"); nothing linked to it.
#
# Only a release changes the repository, so this keys off the release workflow
# finishing rather than the tag itself (a tag cannot deploy to github-pages).
# That is also the moment the APKs actually exist as release assets.
on:
  workflow_run:
    workflows: ['Build & Deploy']
    types: [completed]
  workflow_dispatch: {}

# Pages accepts one deployment at a time. Queue rather than cancel: a cancelled
# run would leave the newest release out of the repository.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned to match ci.yml — see the note there.
  BUN_VERSION: '1.3.14'

# Least privilege by default: a job gets a read-only token unless it declares
# its own `permissions:`, which REPLACES this block rather than adding to it.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # 30 for the F-Droid half, plus the demo recorder (~10 min on a runner).
    timeout-minutes: 45
    # Runs on EVERY completed Build & Deploy, failed or cancelled included. The
    # APKs come from the newest *published* release (`--exclude-drafts` below),
    # and publish-release publishes only once both APKs are attached, so a run
    # that failed before them leaves a draft this cannot see. A run that failed
    # only in a desktop job has published its APKs (#1631); gating on
    # `conclusion == 'success'` froze the repository on v0.8.122 for that.
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Early, because the F-Droid repository has to be built with its own
      # public URL baked into the index — `repo_url` is what a client stores
      # when a user adds the repository, and a wrong one makes every download
      # 404 after the repo is already added.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages

      # --- The F-Droid repository -----------------------------------------
      # Skipped, not failed, when the repo signing key is absent: that is the
      # bootstrap case (no repository yet). Once one is live, the guard before
      # the upload turns the skip into a failure. `has_key` gates every step below.
      - name: Check for the F-Droid repo signing key
        id: key
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FDROID_REPO_KEYSTORE_BASE64" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No FDROID_REPO_KEYSTORE_BASE64 — no F-Droid repository is built."
          fi

      # fdroidserver builds and signs the index; apksigner (Android SDK) is what
      # it reads APK signatures with. Verified against fdroidserver 2.4.5.
      # Pinned, and from PyPI rather than apt: this is the version the repository
      # layout was validated against locally, and Ubuntu's package lags. An
      # index built by a different fdroidserver is not something to discover
      # from a user's client.
      - name: Install fdroidserver
        if: steps.key.outputs.has_key == 'true'
        run: |
          set -euo pipefail
          pipx install 'fdroidserver==2.4.5'
          fdroid --version

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: steps.key.outputs.has_key == 'true'
        with:
          packages: platform-tools build-tools;34.0.0

      # The APKs come from the latest RELEASE, not from this checkout: the
      # repository must serve what was released, and a manual re-run has to
      # republish those same files rather than build new ones.
      - name: Download the latest release's F-Droid APKs
        id: apks
        if: steps.key.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fdroid-apks
          tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          echo "Latest release: $tag"
          # `|| true`: a release predating the F-Droid APKs has none, which is a
          # skip here; the guard before the upload decides whether that fails.
          # The release's OWN APKs since #1168 — there is no separate F-Droid
          # variant any more. TV first: its name is a superset of the phone's,
          # so globbing the phone pattern would otherwise match it too.
          gh release download "$tag" --dir fdroid-apks --pattern 'NicotinD-TV-*.apk' || true
          gh release download "$tag" --dir fdroid-apks --pattern 'NicotinD-[0-9]*.apk' || true
          # The builder expects unversioned names (FDROID_APPS).
          for f in fdroid-apks/NicotinD-TV-*.apk; do
            [ -e "$f" ] && mv "$f" fdroid-apks/NicotinD-TV.apk
          done
          for f in fdroid-apks/NicotinD-[0-9]*.apk; do
            [ -e "$f" ] && mv "$f" fdroid-apks/NicotinD.apk
          done
          if [ -f fdroid-apks/NicotinD.apk ] && [ -f fdroid-apks/NicotinD-TV.apk ]; then
            echo "have_apks=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_apks=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$tag has no Android APKs — no F-Droid repository is built."
          fi

      - name: Build the signed F-Droid repository
        if: steps.key.outputs.has_key == 'true' && steps.apks.outputs.have_apks == 'true'
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$FDROID_REPO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fdroid-repo.keystore"
          chmod 600 "$RUNNER_TEMP/fdroid-repo.keystore"
          FDROID_REPO_URL="${{ steps.pages.outputs.base_url }}/fdroid/repo" \
          FDROID_REPO_KEYSTORE="$RUNNER_TEMP/fdroid-repo.keystore" \
            bun run scripts/build-fdroid-repo.ts fdroid-apks "$RUNNER_TEMP/fdroid-out"
          mkdir -p site/fdroid
          # Only `repo/` is served. The working directory also holds the
          # generated metadata and fdroid's scratch dirs, which are not for
          # publication — and the builder has already deleted the keystore and
          # the password-bearing config.yml.
          cp -r "$RUNNER_TEMP/fdroid-out/repo" site/fdroid/repo
          shred -u "$RUNNER_TEMP/fdroid-repo.keystore"

      # --- The static demo (docs/demo-mode.md) -----------------------------
      # Every publish rebuilds it: one deployment replaces the whole site, so a
      # run that skipped it would take /demo/ down. The recorder boots the real
      # server, so it needs what e2e needs — Chromium and ffmpeg.
      - name: Install Playwright OS deps
        uses: ./.github/actions/playwright-deps
        with:
          install-command: bun run --filter @nicotind/e2e install:deps

      - name: Install Playwright browser
        run: bun run --filter @nicotind/e2e install:browsers

      - name: Install ffmpeg
        run: scripts/ci-apt-install.sh ffmpeg

      # The CC source audio (~420 MB) is pinned by sha1 in the manifest; a hit
      # skips every download, and the Internet Archive is only asked on a change.
      - name: Cache the demo's source audio
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packages/e2e/.tmp-cc-demo/cache
          key: demo-audio-${{ hashFiles('packages/e2e/demo/manifest.json') }}

      # The bundle the recorder's real server serves; E2E_SKIP_BUILD keeps the
      # recorder from building it (and the TV bundle) a second time.
      - name: Build (web)
        run: bun run --filter @nicotind/web build

      # Never blocks the F-Droid repository, whose clients depend on this
      # publish; a failed demo build ships the site without /demo/ instead.
      - name: Build the demo
        continue-on-error: true
        run: bun run scripts/build-demo.ts site
        env:
          E2E_SKIP_BUILD: '1'

      # A landing page, so the site root is not a 404 for someone who trims the
      # URL, and so the repository address is copy-pasteable.
      - name: Write the site index
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: bun run scripts/build-pages-index.ts site

      # REFUSE TO PUBLISH A SITE THAT WOULD DELETE THE LIVE REPOSITORY.
      #
      # One Pages deployment replaces the entire site, so a `site/` without
      # `fdroid/repo` does not leave the published repository alone — it removes
      # it. Every client that added the repository then gets 404s on the index
      # and stops seeing updates, with nothing failing to say so.
      #
      # The "skip, not fail" degradation above is right while bootstrapping (no
      # repository published yet) and destructive once one is live, so the two
      # cases have to be told apart — by asking the live site, which is the only
      # thing that actually knows.
      - name: Refuse to publish a site that would remove a live repository
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          if [ -f site/fdroid/repo/index-v2.json ]; then
            echo "This run built an F-Droid repository — nothing to protect."
            exit 0
          fi
          live="$(curl -s -o /dev/null -w '%{http_code}' -L "$BASE_URL/fdroid/repo/index-v2.json" || echo 000)"
          if [ "$live" = "200" ]; then
            echo "::error::A repository is live at $BASE_URL/fdroid/repo but this run built none."
            echo "::error::Publishing now would delete it and break every client that added it."
            echo "::error::Fix the cause (signing key secret, or the release's F-Droid APKs) and re-run."
            exit 1
          fi
          echo "No repository live (HTTP $live) and none built — bootstrap case, publishing the landing page only."

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # A failed publish leaves every client of the repository on the previous
  # release with nothing visible to them, and a red run on a workflow_run
  # trigger notifies nobody. So a failure opens ONE tracking issue (or comments
  # on the open one), and the next successful publish closes it. Its own job,
  # so `issues: write` is never held by the job that handles the signing key.
  notify:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RELEASE: ${{ github.event.workflow_run.head_branch || 'latest release' }}
    steps:
      - name: Open, update or close the publish-failure issue
        run: |
          set -euo pipefail
          title='F-Droid repository publish failed'
          open="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ "$RESULT" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "Published successfully in $RUN_URL ($RELEASE)."
            fi
            exit 0
          fi
          body="The Pages publish for **$RELEASE** ended \`$RESULT\`: $RUN_URL

          Until a publish succeeds, clients of the self-hosted repository stay on the previous
          release (the live site is left as it was). If the cause was transient, re-run with
          \`gh workflow run pages.yml --ref master\`. This issue closes itself on the next success."
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
