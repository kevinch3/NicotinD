name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  # No workflow_dispatch, and no host deploy: the host runs `edge`, deployed
  # from every green master commit by ci.yml, and rolling back is the "Deploy
  # host" workflow (deploy-host.yml). A release publishes images and apps.

# One release at a time, whatever the tag. `github.sha` grouped by *commit*, so
# two releases were two groups and raced each other (issue #768): on the host
# (which releases no longer deploy — see deploy-host.yml) and over the shared
# `:release` / `:vX` tags, which `promote` moves. The group is workflow-level so
# releases stay ordered: with only `promote` serialized, a later tag could
# finish building first, promote, and then be overwritten by the earlier one.
#
# `cancel-in-progress: false` is the load-bearing half — abandoning a release
# mid-publish leaves it half-applied, which is worse than queueing behind it.
# Same shape as pages.yml.
concurrency:
  group: deploy-host
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pinned to match ci.yml — see the note there.
  BUN_VERSION: '1.3.14'

# Least privilege by default: a job gets a read-only token unless it declares
# its own `permissions:`, which REPLACES this block rather than adding to it.
permissions:
  contents: read

jobs:
  # Every release builds every app artifact. A `changes` job used to diff
  # tag-to-tag to skip unchanged apps, but the release commit itself bumps the
  # root package.json and build.gradle, which its own regexes matched, so it never
  # skipped anything. It was also unsafe to make work: the in-app APK updater,
  # electron-updater and the F-Droid repo (pages.yml, and fdroiddata's `Binaries:`)
  # all read the LATEST release and expect its assets, so a release without an APK
  # breaks them. See docs/releasing.md.
  #
  # The tag's GitHub Release starts as a DRAFT, and `publish-release` publishes
  # it only once the APKs and both desktop feeds are attached. It used to be
  # published within seconds of the tag, with the artifacts landing minutes
  # later: for that window `releases/latest` — what the in-app APK updater,
  # electron-updater and the F-Droid repo read — had nothing on it, and a failed
  # artifact job (v0.8.65's desktop-mac) left it published without its files.
  # Every job addresses the release by the id this job outputs, because
  # `/releases/tags/{tag}` cannot see a draft (scripts/github-release.ts).
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Find or create the tag's draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          id="$(bun scripts/github-release.ts draft --tag "$GITHUB_REF_NAME")"
          echo "Release $GITHUB_REF_NAME is id $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Set the draft's description to this version's CHANGELOG.md section.
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [create-draft]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Extract the `## [<version>] …` section (up to the next version heading)
      # from CHANGELOG.md — the file commit-and-tag-version regenerates on each
      # `bun run release`, checked out here at the tag so it includes this version.
      - name: Extract changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { capture=1; print; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Fallback for a release with no changelog-visible commits (chore/refactor
          # only): an empty body would read as a broken release page.
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            printf 'Maintenance release. See the commit history for details.\n' > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md

      - name: Set the release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/github-release.ts body --id "${{ needs.create-draft.outputs.id }}" --file release-notes.md


  # Build and sign the Android APK and attach it to the GitHub Release. Runs in
  # parallel with `deploy`; a failure here (e.g. missing signing secrets) does not 
  # block the server deploy. Requires repo secrets: ANDROID_KEYSTORE_BASE64, 
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. 
  # See docs/mobile-app.md "Release & signing".
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The ANDROID_KEYSTORE_* signing secrets live in this environment,
    # deployable from `v*` tags only (docs/dependency-management.md).
    environment: release-signing
    # Only on a tag push: these jobs attach assets to the tag's GitHub Release (none
    # exists for a manual dispatch). NOT continue-on-error: a genuine packaging break
    # (unresolved dependency/repo, manifest-merge failure, bad signing) must turn the
    # release run RED so it's caught — not silently ship a release with no APK, as the
    # osbarcode-repo + minSdk breakage did across v0.1.222. It still never blocks the
    # server `deploy` job, which runs in parallel with no `needs` linkage to this one.
    needs: [create-draft]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # F-Droid rebuilds this APK from the same tag and compares it byte-for-byte
      # to the one attached here. It derives SOURCE_DATE_EPOCH as `git log -1
      # --format=%ct`, so deriving it identically is what makes the two builds
      # agree without coordinating. Consumed by the web build's postbuild hook,
      # which pins the service-worker manifest timestamp. See docs/fdroid.md.
      - name: Export SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      # ng build (web) requires Node >= 24.19.0; pin from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      # JDK 21 because fdroiddata's CI builds every app on it
      # (`apt-get install openjdk-21-jdk-headless` + `update-alternatives --set
      # java`), and the JDK that runs gradle decides what ends up in classes.dex.
      # On 17, D8 keeps javac's synthetic enum switch-map class
      # (`HttpRequestHandler$1`); on 21 it does not — one class out of 5,226, and
      # the only difference between our APK and F-Droid's. It fails their
      # reproducible-build check. Capacitor 8 requires 21 too. See docs/fdroid.md.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # `packages` defaults to `tools platform-tools`, and the SDK repository no
      # longer lists the legacy `tools` package: `sdkmanager tools` exited 1 and
      # the v0.6.46 release shipped with no APK. Gradle fetches the build-tools
      # and platform it needs itself; platform-tools is all the action must add.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      # Gradle resolves the phone AND tv release classpaths over the network
      # otherwise, twice per run. Caching the module store lets a re-run resolve
      # offline, which is what makes a re-run useful after a transient registry
      # failure.
      #
      # This used to carry a sharper reason: one dependency (osbarcode-android)
      # came only from OutSystems' Azure feed, whose 503 broke v0.5.53, and a
      # version pin was needed to stop a dynamic range re-checking the remote
      # regardless of the cache. #1168 removed that dependency, the feed and the
      # pin, so the cache is now a plain speed-and-resilience measure — kept,
      # but no longer load-bearing for correctness.
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/**/*.gradle', 'packages/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'bun.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      # Capacitor copies this build into the Android assets on `cap sync`.
      - name: Build web
        run: bun run --filter @nicotind/web build

      - name: Sync Capacitor Android project
        run: bunx cap sync android
        working-directory: packages/mobile

      # Only for the ASSET FILENAMES below — gradle no longer reads these. The
      # version lives as literals in build.gradle, written by `bun run release`,
      # because F-Droid greps that file to see what a tag contains.
      - name: Derive Android version
        run: bun run packages/mobile/scripts/android-env.ts >> "$GITHUB_ENV"

      # Decode the keystore only when the secret is present, so the build fails
      # loudly (unsigned, no matching APK) rather than on a bogus empty keystore.
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building an unsigned APK."
          fi

      # The flavour-specific task, never bare `assembleRelease`: that builds BOTH
      # flavours from whatever bundle is in assets/, so the TV APK would ship the
      # phone UI under the TV id with nothing failing. check:fdroid forbids it.
      - name: Build phone release APK
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assemblePhoneRelease

      # Renamed to the versioned, product-named scheme the other release assets
      # use (NicotinD-<version>.apk) via $NICOTIND_VERSION_NAME, already in
      # $GITHUB_ENV from "Derive Android version". Staged out of the gradle
      # output tree so the TV build below cannot disturb it.
      - name: Stage phone APK
        working-directory: packages/mobile/android/app/build/outputs/apk/phone/release
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          mv app-phone-release.apk "$RUNNER_TEMP/apks/NicotinD-${NICOTIND_VERSION_NAME}.apk"

      # Second APK: the SAME Android project rebuilt with the web bundle from
      # the Angular `tv` configuration (environment.tv.ts → isTvBuild() true).
      # The rebuild is the load-bearing half — a gradle flavour cannot change
      # which web bundle `cap sync` copied into assets/, which is why the `tv`
      # flavour carries only the application id. This is what makes the tv
      # config reachable by users at all: the phone APK has tvBuild:false, so it
      # never gets TV remote-control defaults and keeps the arrow-seek shortcut
      # that breaks D-pad navigation (issue #387).
      - name: Build web (tv configuration)
        run: bun run --filter @nicotind/web build -- --configuration tv

      - name: Sync Capacitor Android project (tv)
        run: bunx cap sync android
        working-directory: packages/mobile

      # The `tv` flavour supplies `.tv`. It used to come from an env var, which
      # F-Droid's buildserver has no way to set — so a TV entry there would have
      # built the phone id. The suffix is what lets phone and TV be two F-Droid
      # entries, and stops a TV APK installing over the phone one.
      - name: Build TV release APK
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleTvRelease

      - name: Stage TV APK
        working-directory: packages/mobile/android/app/build/outputs/apk/tv/release
        run: mv app-tv-release.apk "$RUNNER_TEMP/apks/NicotinD-TV-${NICOTIND_VERSION_NAME}.apk"

      # ATTACH BEFORE VERIFYING. This step must stay ahead of every
      # verification-only step below: v0.6.55 shipped with no APK at all because
      # the F-Droid verification sat here instead, failed on missing signing env,
      # and took the already-built phone and TV APKs down with it. The artifacts
      # users install are the job's product; anything that merely *checks*
      # something runs after they are safely uploaded. No gate enforces this
      # ordering, so keep it by hand.
      - name: Attach APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/github-release.ts upload --id "${{ needs.create-draft.outputs.id }}" "$RUNNER_TEMP"/apks/*.apk

  # Build an UNSIGNED iOS .ipa and attach it to the GitHub Release.
  # The native `ios/` project is NOT committed (it must be generated on a Mac), 
  # so CI generates it ephemerally each run and patches Info.plist via a script. 
  # A failure here does not block the server deploy. See docs/ios-app.md.
  # macos-26: Capacitor 8 requires Xcode 26, which older images do not default to.
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    # Tag-only; NOT continue-on-error — same fail-loud rationale as the `android`
    # job above (parallel with `deploy`, no `needs` linkage, so it never blocks it).
    needs: [create-draft]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      # ng build (web) requires Node >= 24.19.0; pin from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      # Capacitor copies this build into the iOS app on `cap sync`.
      - name: Build web
        run: bun run --filter @nicotind/web build

      # ios/ is not committed (needs a Mac to generate); create it ephemerally.
      # `cap add ios` is a no-op if it somehow already exists. CocoaPods, not
      # Capacitor 8's SPM default: @nicotind/capacitor-now-playing ships only a
      # podspec, and the build below opens App.xcworkspace, which only the pods
      # template has.
      - name: Generate + sync iOS project
        working-directory: packages/mobile
        run: |
          bunx cap add ios --packagemanager CocoaPods || true
          bunx cap sync ios

      # The ios/ project is ephemeral, so its AppIcon + splash are the default
      # Capacitor mark — regenerate the branded AppIcon and splash screen from the
      # committed assets/ sources (the same brand mark as the Android assets + PWA
      # manifest). Android assets are committed, so only iOS needs this in CI.
      - name: Generate branded iOS app icon + splash
        working-directory: packages/mobile
        run: bunx @capacitor/assets@3 generate --ios

      # CFBundleShortVersionString/CFBundleVersion, derived from the monorepo
      # version (same scheme as Android), consumed by the Info.plist patch below.
      - name: Derive iOS version
        run: bun run packages/mobile/scripts/ios-env.ts >> "$GITHUB_ENV"

      # Inject UIBackgroundModes: [audio] (background playback) + the version
      # keys into the generated Info.plist (there is no committed one to edit).
      - name: Patch Info.plist
        run: bun run packages/mobile/scripts/ios-plist.ts

      - name: Build unsigned .app and package .ipa
        working-directory: packages/mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # Versioned, product-named scheme matching the other release assets
          # (NicotinD-<version>-unsigned.ipa); $NICOTIND_IOS_SHORT_VERSION is
          # already in $GITHUB_ENV from the "Derive iOS version" step above.
          zip -r "NicotinD-${NICOTIND_IOS_SHORT_VERSION}-unsigned.ipa" Payload

      # By id, so it lands whether publish-release has already published the
      # release or not: iOS is deliberately NOT in publish-release's needs.
      - name: Attach unsigned IPA to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/github-release.ts upload --id "${{ needs.create-draft.outputs.id }}" packages/mobile/ios/App/NicotinD-*-unsigned.ipa

  # Build the Linux desktop app (AppImage + deb) via electron-builder and attach
  # it — together with electron-updater's `latest-linux.yml` feed, which
  # electron-builder writes to `release/` even with `--publish never` — to the
  # tag's draft release BY ID. electron-builder never publishes itself: its
  # publisher looks the release up by tag, the API reports a draft's tag as
  # `untagged-…`, and it then created and published a second, desktop-only
  # release that became `latest` without the APKs (v0.8.103). Tag-only; NOT continue-on-error — same
  # fail-loud rationale as android/ios above: a broken deb/AppImage must turn the
  # run red (e.g. the scoped-name deb bug that silently shipped no Linux artifacts),
  # yet it still never blocks `deploy`, which runs in parallel with no `needs` link.
  #
  # Fail-loud was not enough on its own: the publisher can decline to upload and
  # still exit 0, which is #1261. The verify step below closes that, and
  # `check:desktop-publish` keeps it wired to every packaging job.
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [create-draft]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      # electron-builder itself (and ng build for the web bundle it stages)
      # wants Node >= 24.19.0; pin from .nvmrc, same as android/ios.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      - name: Build desktop main/preload
        run: bun run --filter @nicotind/desktop build

      # Stages the web build, bun/ffmpeg binaries, and backend entry into
      # packages/desktop/resources/ per electron-builder.yml's extraResources
      # contract (see that file's header comment).
      - name: Stage desktop resources
        run: bun run --filter @nicotind/desktop prepare-resources

      - name: Package Linux desktop app
        working-directory: packages/desktop
        # electron-builder is a Node CLI and crashes under Bun's runtime
        # (`--bun`) via source-map-support; run it under Node (setup-node above).
        # Override the desktop package version (static 0.1.0) with the release
        # version from the tag (v0.1.207 -> 0.1.207) so the artifacts and the
        # update feed carry THIS release's version.
        run: bunx electron-builder --linux --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      # By id, like android/ios: the one upload path that sees the draft.
      - name: Attach the Linux desktop artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run packages/desktop/scripts/release-artifacts.ts | xargs bun scripts/github-release.ts upload --id "${{ needs.create-draft.outputs.id }}"

      # An upload step that exits 0 is not a promise that everything arrived:
      # electron-builder's publisher once logged `skipped publishing` per file and
      # exited 0 (#1261 — ~40 green releases with no Linux artifact and no updater
      # feed). This compares the release against what electron-builder actually
      # wrote to `release/`, so any future skip is red. Runs AFTER the upload,
      # never between build and upload.
      - name: Verify the Linux artifacts reached the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run packages/desktop/scripts/verify-published-assets.ts --label desktop-linux --release-id "${{ needs.create-draft.outputs.id }}"

  # Build the macOS desktop app (dmg, arm64 only — Intel/x64 dropped) and attach
  # it the same way (electron-updater reads `latest-mac.yml`). Ad-hoc signed — no
  # Apple Developer ID in scope for v1, so electron-builder.yml leaves `identity`
  # UNSET (never `identity: null`, which would re-break arm64);
  # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from probing the
  # runner's keychain for a signing identity to auto-use.
  desktop-mac:
    runs-on: macos-14
    timeout-minutes: 40
    # NOT continue-on-error — see desktop-linux above for the fail-loud rationale.
    needs: [create-draft]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: bun install

      - name: Build desktop main/preload
        run: bun run --filter @nicotind/desktop build

      - name: Stage desktop resources
        run: bun run --filter @nicotind/desktop prepare-resources

      - name: Package macOS desktop app
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # Run electron-builder under Node, not Bun (`--bun` crashes it).
        # extraMetadata.version: use the release tag's version (see desktop-linux).
        run: bunx electron-builder --mac --publish never -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      # By id — see desktop-linux for why electron-builder does not publish.
      - name: Attach the macOS desktop artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run packages/desktop/scripts/release-artifacts.ts | xargs bun scripts/github-release.ts upload --id "${{ needs.create-draft.outputs.id }}"

      # Same backstop as desktop-linux — see the rationale there.
      - name: Verify the macOS artifacts reached the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run packages/desktop/scripts/verify-published-assets.ts --label desktop-mac --release-id "${{ needs.create-draft.outputs.id }}"

  # Publish the draft once everything users update from is on it: both APKs
  # (the in-app updater and F-Droid) and both electron-updater feeds. The unsigned
  # IPA is deliberately not required — it is sideload-only, and a flaky macOS
  # runner there must not hold the APK back from Android users. The script
  # re-checks the assets itself rather than trusting the needs alone, and
  # publishes with make_latest=legacy so a release published late (a re-run)
  # cannot take `latest` from a newer one.
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [create-draft, release-notes, android, desktop-linux, desktop-mac]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          bun scripts/github-release.ts publish --id "${{ needs.create-draft.outputs.id }}" \
            --expect "NicotinD-$v.apk,NicotinD-TV-$v.apk,latest-linux.yml,latest-mac.yml"

  # Build + publish the multi-arch server image to GHCR (Immich-style): one
  # native-runner build per arch pushed by digest, then `docker-merge` stitches
  # the digests into a single tagged manifest. Native arm64 runners (free for
  # public repos) instead of QEMU — Bun's JIT is unreliable under emulation.
  # Tag-only: a workflow_dispatch deploy reuses the last published `release`
  # image rather than publishing from an untagged master tip.
  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/kevinch3/nicotind
    steps:
      - uses: actions/checkout@v7

      # linux/amd64 -> linux-amd64, for artifact names + cache scopes.
      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest (no tag): the version tag is added once in docker-merge
      # and the floating tags only in `promote`, so a half-published or broken
      # release can never move `release`/`vX`.
      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Busts ONLY the apt layer (issue #730): the rest of the cache stays
          # useful, but `apt-get upgrade` re-executes every build instead of
          # being served from a July-vintage blob while Trivy blocks the deploy
          # over a CVE the archive had already fixed.
          # NICOTIND_BUILD_COMMIT stamps the web bundle with the tree this image
          # was built from, so the About page's AGPL §13 source offer points at
          # the exact source (docs/licensing.md). It does not cost cache: a
          # release bumps the root package.json this stage COPYs first anyway.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
            NICOTIND_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      # Boot the image this release actually pushed — pulled back by digest,
      # not the local build cache — before anything tags it. The ci.yml smoke
      # ran on a PR build; this one runs on the bytes self-hosters will pull,
      # and asserts it reports the tag's own version.
      - name: Smoke — boot the pushed image and verify it serves
        run: |
          set -euo pipefail
          ref="$IMAGE@${{ steps.build.outputs.digest }}"
          docker pull "$ref"
          bash scripts/smoke-image.sh "$ref" "${GITHUB_REF_NAME#v}"

      - name: Smoke — container logs on failure
        if: failure()
        run: docker logs nicotind-smoke 2>&1 | tail -100 || true

      - name: Smoke — clean up
        if: always()
        run: docker rm -f nicotind-smoke 2>/dev/null || true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-arch digests into one multi-arch manifest tagged ONLY with
  # the exact release, `vX.Y.Z` (pin this to hold/rollback a version), then
  # scan it. The floating tags move in `promote`, after this job succeeds.
  docker-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker]
    if: github.ref_type == 'tag'
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/kevinch3/nicotind
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}" # vX.Y.Z
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:$version" "${refs[@]}"

      # `imagetools create` can report success while a tag ends up unresolvable
      # (issue #457: v0.1.329's push 403'd and that version has no image to this
      # day). Assert the tag we just claimed actually resolves, so a publish
      # hole fails the release instead of being discovered months later by
      # whoever pins to it.
      - name: Verify the version tag resolves
        run: docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME}"

      # Scans the BASE IMAGE's OS packages. Deliberately non-overlapping with
      # `check:audit`, which owns npm dependencies and structurally cannot see
      # a Debian package in the oven/bun layer. Keeping them disjoint means a
      # failure in either is unambiguous about what to go and fix.
      #
      # `ignore-unfixed` because an OS CVE with no available patch is not
      # actionable — blocking a release on one would train us to bypass this.
      # A finding here therefore always means: a fixed version exists, bump the
      # base image in the Dockerfile.
      #
      # This runs before `promote`, so a finding leaves `release` and `vX` on the
      # previous, clean release: only the exact `vX.Y.Z` exists, and nothing
      # pulls that unless it is pinned. It also stops `deploy`, through
      # `promote`, from putting it on the host.
      - name: Scan the published image for OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          vuln-type: os
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  # Publish the analysis sidecar image (amd64 only: essentia-tensorflow ships
  # x86_64-only wheels, so an arm64 build has never been possible). Single-arch
  # → no digest/merge dance. Same tag semantics as the server image: only
  # `vX.Y.Z` here, the floating tags in `promote`.
  docker-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kevinch3/nicotind-analysis
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packages/analysis
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=analysis-linux-amd64
          cache-to: type=gha,mode=max,scope=analysis-linux-amd64

  # Move the floating tags, for both images, only once the release's own
  # images exist, booted (docker) and scanned (docker-merge):
  #   vX      — major metatag (Immich-style; excludes nothing today at v0)
  #   release — stable metatag, the docker-compose.yml default
  # Deliberately NO `latest` tag: `release` is the explicit equivalent, and it
  # never points at an untagged build. Both images move in one job, so the
  # server and analysis `release` tags can no longer disagree after a failure
  # in one of them. Each tag is created from the verified `vX.Y.Z`, so it is
  # the same digest, never a rebuild.
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-merge, docker-analysis]
    if: github.ref_type == 'tag'
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point vX and release at this release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}" # vX.Y.Z
          major="${version%%.*}"       # vX
          for image in ghcr.io/kevinch3/nicotind ghcr.io/kevinch3/nicotind-analysis; do
            docker buildx imagetools create -t "$image:$major" -t "$image:release" "$image:$version"
          done

      # Same #457 check as docker-merge, for the tags this job claimed.
      - name: Verify the floating tags resolve
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          major="${version%%.*}"
          for image in ghcr.io/kevinch3/nicotind ghcr.io/kevinch3/nicotind-analysis; do
            for tag in "$version" "$major" release; do
              echo "::group::inspect $image:$tag"
              docker buildx imagetools inspect "$image:$tag"
              echo "::endgroup::"
            done
          done
