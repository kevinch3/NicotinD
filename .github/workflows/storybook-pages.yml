name: Storybook Pages

# The component catalog documents the components as they exist *now*, so it publishes
# from master rather than from a release tag. Tag-triggered publishing left the catalog
# lagging to the last release, which is the wrong target for a reference a developer
# reads before using a component — and stale docs are treated as a bug here.
#
# PREREQUISITE: Pages must be enabled for the repo with source "GitHub Actions"
# (Settings → Pages). A workflow cannot enable it.
on:
  push:
    branches: [master]
    # Only rebuild when something the catalog renders could have changed. Breakage from
    # anywhere else is caught by the `ci` job's build + smoke steps on the same push.
    paths:
      - 'packages/web/**'
      - 'packages/core/**'
      - '.github/workflows/storybook-pages.yml'
  workflow_dispatch: {}

# Pages accepts one deployment at a time. Queue rather than cancel: a cancelled run
# would leave the published catalog behind the master it claims to document.
concurrency:
  group: storybook-pages
  cancel-in-progress: false

env:
  # Pinned to match ci.yml — see the note there.
  BUN_VERSION: '1.3.11'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install

      - name: Build Storybook
        run: bun run build:storybook

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/storybook-static

      - id: deploy
        uses: actions/deploy-pages@v5
