services:
  nicotind:
    # Published multi-arch image (see docs/deployment.md). `release` is the
    # stable metatag (latest tagged release, Immich-style); pin `NICOTIND_VERSION`
    # (e.g. v0.1.230) in a `.env` file to hold/rollback a version. To build from
    # source instead, add a `build: .` override — see
    # docker-compose.override.example.yml.
    image: ghcr.io/kevinch3/nicotind:${NICOTIND_VERSION:-release}
    user: "1000:1000"
    group_add:
      - "981"
    ports:
      - "8484:8484"
    volumes:
      - nicotind-data:/data/nicotind
      - music:/data/music
      # SECURITY: bind-mounting /var/run/docker.sock grants the `nicotind`
      # container full Docker API access = host-root-equivalent privilege.
      # Required for the admin log-streaming feature (packages/api/src/routes/
      # system.ts). The container runs as UID 1000 but this does not mitigate
      # socket access. Remove this bind mount unless you need log streaming.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NICOTIND_MODE: external
      NICOTIND_PORT: "8484"
      NICOTIND_DATA_DIR: /data/nicotind
      NICOTIND_MUSIC_DIR: /data/music
      NICOTIND_LIDARR_URL: http://lidarr:8686
      LIDARR_API_KEY: nicotind-lidarr-internal
      NICOTIND_ANALYSIS_URL: http://analysis:8000
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8484/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      lidarr:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # PO-token provider for in-process spotdl's YouTube fetches. YouTube demands
  # "proof of origin" tokens from unrecognized clients; the pip-installed
  # bgutil-ytdlp-pot-provider plugin (see Dockerfile) fetches them from this
  # companion service. (yt-dlp is now the external ytdlp-addon, which brings its
  # own pot-provider companion — see the ytdlp-addon profile below.)
  # It shares the nicotind container's network namespace so
  # the plugin's default base URL (http://127.0.0.1:4416) just works — no
  # per-invocation extractor-args plumbing through spotdl/yt-dlp needed.
  bgutil-provider:
    # Pinned: the provider version must pair with the pip-installed
    # bgutil-ytdlp-pot-provider plugin baked into the nicotind image (see
    # Dockerfile) — a mismatch silently breaks YouTube downloads. Set
    # BGUTIL_VERSION in `.env` to move both at once; `bun run check:bgutil-pin`
    # (CI) fails if the two baked defaults ever drift apart. See issue #238.
    # Our own build of the same upstream source (issue #238) — GPL-3.0, built by
    # the `docker-pot-provider` job in deploy.yml from the BGUTIL_VERSION pin
    # below, so the provider tracks our release cadence instead of a third
    # party's. Override to `brainicism/bgutil-ytdlp-pot-provider:${BGUTIL_VERSION}`
    # to fall back to upstream's image.
    image: ghcr.io/kevinch3/nicotind-pot-provider:${NICOTIND_IMAGE_TAG:-release}
    # why explicit `runtime: runc`: a host whose Docker daemon's default
    # runtime is the NVIDIA container runtime (e.g. after `nvidia-ctk runtime
    # configure --runtime=nvidia --set-as-default`) will try to bind-mount
    # `/run/nvidia-persistenced/socket` into every container. The bgutil-provider
    # image is a plain Node.js app with no CUDA dependency — that mount fails
    # on hosts without NVIDIA drivers and the container can't start. The
    # compose file is the contract, so don't depend on the host's default.
    runtime: runc
    network_mode: "service:nicotind"
    depends_on:
      nicotind:
        condition: service_started
    restart: unless-stopped

  # Soulseek daemon — the slskd ADDON's dependency, not core's (phase 3):
  # both live behind the `slskd-addon` profile and deploy together.
  slskd:
    profiles: ["slskd-addon"]
    image: slskd/slskd:0.25.1
    user: "1000:1000"
    volumes:
      - music:/data/music
      - slskd-data:/app
      - ./scripts/slskd-entrypoint.sh:/slskd-entrypoint.sh:ro
    entrypoint: ["/slskd-entrypoint.sh"]
    command:
      - --remote-configuration=true
      - --http-port=5030
      - --no-https=true
      - --slsk-listen-port=50300
      - --username=slskd
      - --password=slskd
      - --downloads=/data/music
    environment:
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_HTTP_PORT: "5030"
      SLSKD_NO_HTTPS: "true"
      SLSKD_SLSK_LISTEN_PORT: "50300"
      SLSKD_USERNAME: slskd
      SLSKD_PASSWORD: slskd
      SLSKD_DIRECTORIES__INCOMPLETE: /app/incomplete
    healthcheck:
      # why: the slskd image ships no curl/wget, so a curl-based check fails at
      # exec time and marks the container permanently unhealthy; bash /dev/tcp
      # needs no extra binaries. /health is slskd's unauthenticated probe.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/5030 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  # Audio-analysis sidecar (Essentia embeddings + tagging heads). The API has NO
  # depends_on for it — everything degrades gracefully when the sidecar is down;
  # only the audio-features enrichment task pauses.
  analysis:
    # Published image (amd64 only — essentia-tensorflow ships x86_64 wheels
    # exclusively, so this sidecar has never been runnable on arm64; on an
    # arm64 host remove/disable this service, everything else degrades
    # gracefully). GPU inference still builds from source via an override —
    # see docker-compose.override.example.yml + docs/audio-ml-enrichment.md.
    image: ghcr.io/kevinch3/nicotind-analysis:${NICOTIND_VERSION:-release}
    # why explicit `runtime: runc`: the published image is the CPU build,
    # which has no CUDA libs. The published image runs on CPU regardless of
    # host GPU/compute capability. GPU inference is opt-in via the override
    # file (which switches to `nvidia` via deploy.resources). Don't let the
    # host's default runtime quietly try to bind-mount the NVIDIA socket
    # into a CPU-only container.
    runtime: runc
    user: "1000:1000"
    volumes:
      - music:/data/music:ro
    environment:
      MUSIC_DIR: /data/music
    # GPU inference (optional, ~10x faster embeddings; needs the NVIDIA
    # container toolkit on the host) is opt-in via the docker-compose.gpu.yml
    # overlay — enable it with `-f docker-compose.gpu.yml` or COMPOSE_FILE
    # (see that file's header + docs/audio-ml-enrichment.md). It lives in its
    # own overlay rather than the local override so a host GPU / nvidia-
    # persistenced problem can't wedge the default CPU deploy.
    networks:
      - internal
    restart: unless-stopped

  # The slskd acquisition addon (acquisition addon protocol —
  # docs/acquisition-addon-protocol.md). Opt-in:
  # `docker compose --profile slskd-addon up -d`, then register it in
  # Settings → Extensions → "Add a remote addon" with the URL
  # http://slskd-addon:8585 and the token you set below. Phase 4 shipped the
  # repo split, so this pulls the published image from its own repo
  # (github.com/kevinch3/nicotind-slskd-addon); build from source there.
  slskd-addon:
    image: ghcr.io/kevinch3/nicotind-slskd-addon:latest
    profiles: ["slskd-addon"]
    environment:
      SLSKD_ADDON_TOKEN: ${SLSKD_ADDON_TOKEN:-change-me}
      SLSKD_ADDON_SLSKD_URL: http://slskd:5030
      SLSKD_ADDON_SLSKD_USERNAME: slskd
      SLSKD_ADDON_SLSKD_PASSWORD: slskd
      # This compose's slskd lands completed files in /data/music
      # (--downloads above) — the addon resolves + serves them from there.
      # During a soak run, disable the in-process slskd plugin in Extensions
      # so the addon and the legacy watcher don't both process completions.
      SLSKD_ADDON_DOWNLOADS_DIR: /data/music
      SLSKD_ADDON_MUSIC_DIR: /data/music
    volumes:
      - slskd-addon-data:/data
      - music:/data/music:ro
    depends_on:
      slskd:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  # The yt-dlp acquisition addon (acquisition addon protocol — resolves audio
  # from any yt-dlp-supported URL: YouTube, SoundCloud, Bandcamp, …). Opt-in:
  # `docker compose --profile ytdlp-addon up -d`, then register it in Settings →
  # Extensions → "Add a remote addon" with the URL http://ytdlp-addon:8586 and
  # the token you set below. Core carries no yt-dlp code — it becomes the
  # low-priority catch-all URL resolver (priority -10). Own repo + published
  # image: github.com/kevinch3/nicotind-ytdlp-addon.
  ytdlp-addon:
    image: ghcr.io/kevinch3/nicotind-ytdlp-addon:latest
    profiles: ["ytdlp-addon"]
    environment:
      YTDLP_ADDON_TOKEN: ${YTDLP_ADDON_TOKEN:-change-me}
      # Its own pot-provider companion (below) shares this container's network
      # namespace, so the addon's default http://127.0.0.1:4416 just works.
    volumes:
      - ytdlp-addon-data:/data
    networks:
      - internal
    restart: unless-stopped

  # PO-token provider dedicated to the ytdlp-addon (mirrors the core-side
  # bgutil-provider that serves in-process spotdl). Shares the addon's network
  # namespace so the baked bgutil yt-dlp plugin reaches it at 127.0.0.1:4416.
  ytdlp-pot-provider:
    image: ghcr.io/kevinch3/nicotind-pot-provider:${NICOTIND_IMAGE_TAG:-release}
    profiles: ["ytdlp-addon"]
    runtime: runc
    network_mode: "service:ytdlp-addon"
    depends_on:
      ytdlp-addon:
        condition: service_started
    restart: unless-stopped

  lidarr:
    # Pinned (was :latest): a silent Lidarr major bump can break the API
    # client. Bump deliberately after checking the Lidarr changelog.
    image: linuxserver/lidarr:3.1.0
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      LIDARR__AUTH__APIKEY: nicotind-lidarr-internal
    volumes:
      - lidarr-config:/config
      - music:/data/music
    healthcheck:
      test:
        - CMD
        - curl
        - -sf
        - http://localhost:8686/api/v1/system/status
        - -H
        - "X-Api-Key: nicotind-lidarr-internal"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  nicotind-data:
  music:
  slskd-data:
  slskd-addon-data:
  ytdlp-addon-data:
  lidarr-config:
