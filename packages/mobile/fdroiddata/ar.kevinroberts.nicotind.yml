# The fdroiddata metadata for the PHONE app. Copy to
# metadata/ar.kevinroberts.nicotind.yml in a fdroiddata fork; see docs/fdroid.md.
#
# Kept here, not only in the fork, so the recipe is reviewed with the code it
# builds and check:fdroid can hold it to that code — it pins the toolchain by
# hand, because F-Droid's buildserver runs gradle against a source checkout and
# never sees our CI.
#
# `commit:` is a full 40-character hash, never a tag or branch: a tag can be
# moved or deleted after review, so it does not identify what was audited.
#
# The version fields below are a SEED for the first build entry, not a mirror of
# the current release: once the app is in fdroiddata, `AutoUpdateMode: Version`
# has F-Droid add build entries from our tags itself. Set them to whatever
# release the merge request is opened against; nothing gates them, deliberately,
# because gating them would fail every release for a value F-Droid owns.
#
# `gradle: [phone]` is load-bearing. With product flavours present, `yes` makes
# fdroidserver run a bare `assembleRelease` and then look for an APK under
# outputs/apk/release/, which no longer exists — "No apks match".
Categories:
  - Multimedia
License: AGPL-3.0-only
AuthorName: Kevin Roberts
SourceCode: https://github.com/kevinch3/NicotinD
IssueTracker: https://github.com/kevinch3/NicotinD/issues
Changelog: https://github.com/kevinch3/NicotinD/blob/HEAD/CHANGELOG.md

AutoName: NicotinD

RepoType: git
Repo: https://github.com/kevinch3/NicotinD.git
Binaries: https://github.com/kevinch3/NicotinD/releases/download/v%v/NicotinD-%v.apk

Builds:
  - versionName: 0.8.7
    versionCode: 8007
    commit: b11d3d591038964451ac12431cb95984b8842bf6
    subdir: packages/mobile/android/app
    sudo:
      # Angular's CLI refuses anything below 22.22.3 / 24.15.0 / 26.0.0, and the
      # buildserver ships Node 24.3.0 — so `fdroid build` failed here on the
      # first real run even though bun installed fine. bun shells out to the
      # system node for `ng`, so pinning node is not optional. Same version as
      # .nvmrc, checksummed against nodejs.org's published SHASUMS256.txt.
      - install -d /opt/node
      - curl -fsSL -o /tmp/node.tar.xz
          https://nodejs.org/dist/v22.22.3/node-v22.22.3-linux-x64.tar.xz
      - echo "2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f  /tmp/node.tar.xz"
          | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
      - ln -sf /opt/node/bin/node /usr/local/bin/node
      - ln -sf /opt/node/bin/npm /usr/local/bin/npm
      - rm -f /tmp/node.tar.xz
      - install -d /opt/bun
      - curl -fsSL -o /tmp/bun.zip
          https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-linux-x64.zip
      - echo "8611ba935af886f05a6f38740a15160326c15e5d5d07adef966130b4493607ed  /tmp/bun.zip"
          | sha256sum -c -
      - unzip -j -d /opt/bun /tmp/bun.zip
      - chmod 755 /opt/bun/bun
      - ln -sf /opt/bun/bun /usr/local/bin/bun
      - rm -f /tmp/bun.zip
    # One entry per command. fdroidserver joins these with `; ` and runs the
    # result under `bash -e`, so a failure still stops the build and the `cd`
    # persists into the following entries — no `&&` chaining needed.
    prebuild:
      - cd ../../../..
      - bun install --frozen-lockfile
      - bun run --filter @nicotind/web build
      - cd packages/mobile
      - bunx cap sync android
    gradle:
      - phone

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.8.7
CurrentVersionCode: 8007
AllowedAPKSigningKeys: 5bf701a0ff9a2cd75f279404d2c8b4bf16ed2bb8591709ae2c8560bc557d6bea
