apply plugin: 'com.android.application'

android {
    namespace "ar.kevinroberts.nicotind"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.kevinroberts.nicotind"
        // F-Droid requires a distinct application id per app entry, and the phone
        // and TV APKs otherwise share one (they differ only in the web bundle
        // `cap sync` copied in). CI passes ".tv" for the F-Droid TV build; the
        // sideloaded GitHub TV APK keeps the bare id, so an F-Droid install lands
        // ALONGSIDE it instead of failing to upgrade it. See docs/fdroid.md.
        applicationIdSuffix System.getenv("NICOTIND_APP_ID_SUFFIX") ?: ""
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Driven by the monorepo version via CI (scripts/android-env.ts, derived
        // from package.json by @nicotind/mobile's androidVersion()). Locals avoid
        // the `versionCode (...)` space-before-paren Groovy method-call ambiguity.
        def envVersionCode = System.getenv("NICOTIND_VERSION_CODE")
        def envVersionName = System.getenv("NICOTIND_VERSION_NAME")
        versionCode envVersionCode ? envVersionCode.toInteger() : 1
        versionName envVersionName ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is supplied entirely via env (CI decodes the keystore from a
    // secret). With no keystore env present (local dev) the release build is left
    // unsigned, so contributors can still `assembleStandardRelease` without secrets.
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    // Distribution channel. The only difference is which permissions survive the
    // manifest merge: the F-Droid variant excludes the non-free Capacitor plugins
    // (via `android.includePlugins`, see ../../src/fdroid.ts), so CAMERA and
    // REQUEST_INSTALL_PACKAGES would be declared with nothing left to use them.
    // A flavor rather than a second hand-maintained manifest — src/fdroid's
    // overlay is three `tools:node="remove"` lines and the merger does the rest,
    // so the manifest contract stays in ONE file and one test covers it.
    flavorDimensions "distribution"
    productFlavors {
        standard { dimension "distribution" }
        fdroid { dimension "distribution" }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
