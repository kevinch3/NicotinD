apply plugin: 'com.android.application'

android {
    namespace "ar.kevinroberts.nicotind"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.kevinroberts.nicotind"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Written by `bun run release` (packages/mobile/scripts/android-version.ts,
        // via .versionrc.json's postchangelog hook) from the monorepo version.
        // Literals, not computed: F-Droid's checkupdates greps this file with
        // /versionCode\s*=?\s*["'(]*([0-9]+)/ to decide what a tag contains, and a
        // Groovy expression matches nothing — AutoUpdateMode would silently stop
        // seeing new releases. build-gradle.test.ts pins both to package.json.
        versionCode 8074
        versionName "0.8.74"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Phone and TV are separate apps — F-Droid requires a distinct application id
    // per entry, and sharing one let a TV APK install over the phone one and
    // silently swap the UI.
    //
    // These flavours carry NO code, resources or dependencies: what differs
    // between the two APKs is the web bundle `cap sync` copied into assets, and
    // the id below. They exist because fdroidserver reads a second app's store
    // listing only from `src/<flavour>/fastlane/` when the recipe's `gradle:`
    // names that flavour — and because F-Droid's buildserver cannot supply the
    // id through the environment the way our CI used to. See docs/fdroid.md.
    //
    // NEVER run a bare `assembleRelease`: it builds BOTH flavours from whatever
    // bundle happens to be in assets/, so the TV APK would ship the phone UI
    // under the TV id, with nothing failing. check:fdroid forbids it.
    flavorDimensions "formFactor"
    productFlavors {
        phone {
            dimension "formFactor"
        }
        tv {
            dimension "formFactor"
            applicationIdSuffix ".tv"
        }
    }
    // Release signing is supplied entirely via env (CI decodes the keystore from a
    // secret). With no keystore env present (local dev) the release build is left
    // unsigned, so contributors can still `assembleRelease` without secrets.
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    // AGP embeds an encrypted, Google-readable list of our dependencies in the
    // APK signing block by default. F-Droid rebuilds this APK and compares it
    // byte-for-byte against the published one, and a blob nobody can inspect is
    // exactly the wrong thing to carry into that comparison. Nothing reads it
    // outside Play, so it is pure cost here.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    buildTypes {
        release {
            // Also a reproducibility property, not only a size one: R8 is not
            // deterministic across versions, so turning this on needs its own
            // rebuild comparison first. See docs/fdroid.md.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
