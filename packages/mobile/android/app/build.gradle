apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// The monorepo version is the single source of truth for the app version, and
// gradle reads it directly rather than only accepting it from the environment.
// CI still exports NICOTIND_VERSION_* (scripts/android-env.ts) and that wins,
// but a build without them — a contributor's local `assembleRelease`, or
// F-Droid's buildserver, which does not run our CI scripts — used to silently
// produce versionCode 1 / versionName "1.0". An APK that lies about its version
// cannot be updated by any store, so the fallback has to be the real version,
// not a placeholder. Mirrors androidVersion() in packages/mobile/src/version.ts:
// major*1e6 + minor*1e3 + patch, monotonic while minor and patch stay < 1000.
ext.nicotindVersion = { ->
    def semver = new JsonSlurper()
        .parse(file("$rootDir/../../../package.json"))
        .version
    def m = (semver =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (!m) throw new GradleException("Unparseable monorepo version: $semver")
    def (major, minor, patch) = [1, 2, 3].collect { m[0][it].toInteger() }
    if (minor >= 1000 || patch >= 1000) {
        throw new GradleException("minor/patch must be < 1000 for a monotonic versionCode: $semver")
    }
    [name: "${major}.${minor}.${patch}", code: major * 1_000_000 + minor * 1_000 + patch]
}()

android {
    namespace "ar.kevinroberts.nicotind"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.kevinroberts.nicotind"
        // Phone and TV are separate apps. The TV build sets ".tv" on EVERY
        // channel (#1168) — an application id cannot depend on where the file
        // was downloaded from, and F-Droid requires a distinct id per entry.
        // See docs/fdroid.md and packages/mobile/src/app-id.ts.
        applicationIdSuffix System.getenv("NICOTIND_APP_ID_SUFFIX") ?: ""
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Env wins (CI's scripts/android-env.ts); otherwise the version read
        // straight out of package.json above. Locals avoid the
        // `versionCode (...)` space-before-paren Groovy method-call ambiguity.
        def envVersionCode = System.getenv("NICOTIND_VERSION_CODE")
        def envVersionName = System.getenv("NICOTIND_VERSION_NAME")
        versionCode envVersionCode ? envVersionCode.toInteger() : nicotindVersion.code
        versionName envVersionName ?: nicotindVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is supplied entirely via env (CI decodes the keystore from a
    // secret). With no keystore env present (local dev) the release build is left
    // unsigned, so contributors can still `assembleRelease` without secrets.
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    // AGP embeds an encrypted, Google-readable list of our dependencies in the
    // APK signing block by default. F-Droid rebuilds this APK and compares it
    // byte-for-byte against the published one, and a blob nobody can inspect is
    // exactly the wrong thing to carry into that comparison. Nothing reads it
    // outside Play, so it is pure cost here.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    buildTypes {
        release {
            // Also a reproducibility property, not only a size one: R8 is not
            // deterministic across versions, so turning this on needs its own
            // rebuild comparison first. See docs/fdroid.md.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
