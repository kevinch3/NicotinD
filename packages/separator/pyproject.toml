[project]
name = "nicotind-separator"
version = "0.1.0"
description = "NicotinD vocal-separation sidecar: BS-RoFormer instrumental stems over HTTP (GPU-only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.optional-dependencies]
# The real model stack — deliberately NOT in dev/CI installs. torch itself is
# installed FIRST from requirements-torch-cu126.txt (the cu126 index is the
# legacy lane that still ships Pascal sm_61 kernels; the default PyPI wheel is
# cu128+ and would silently drop the prod card), so bs-roformer's own
# `torch>=2.0` requirement resolves to that wheel instead of pulling another.
# bs-roformer is pinned to the last release whose block layout matches the
# anvuew checkpoint (0.6.1+ mismatch 620–668 tensors — docs/vocal-separation.md).
models = [
  "bs-roformer==0.4.1",
  "soundfile>=0.12",
  "packaging>=23",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.4",
  "soundfile>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
