<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NicotinD</title>
    <base href="/" />
    <!-- viewport-fit=cover lets the layout extend under the iOS notch/home
         indicator and makes env(safe-area-inset-*) non-zero so the sticky header
         (top) and the player/bottom-nav (bottom) can pad themselves clear of it.
         No-op on desktop / non-notched screens (insets resolve to 0).
         maximum-scale/user-scalable: the app has no zoom (docs/web-ui.md); this
         also stops iOS zooming in on focusing a field under 16px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- Favicons (brand mark — generated from the manifest icon source by
         scripts/generate-icons.ts). SVG first for crisp high-DPI tabs; PNG and
         .ico fall back for older browsers. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NicotinD" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply theme before first paint to avoid flash
      (function () {
        var THEMES = ['midnight', 'daylight', 'warm-paper', 'oled', 'twilight', 'forest', 'eink'];
        try {
          var stored = JSON.parse(localStorage.getItem('nicotind-theme') || '{}');
          var state = stored.state || {};
          var theme = state.theme || 'midnight';
          var sys = state.systemTheme;
          if (sys) {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'daylight'
              : 'midnight';
          }
          if (THEMES.indexOf(theme) === -1) theme = 'midnight';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'midnight');
        }
      })();
    </script>
  </head>
  <body style="background-color: var(--theme-bg, #09090b); color: var(--theme-text-primary, #f4f4f5);" class="antialiased">
    <app-root></app-root>
    <script>
      // Engine floor guard (docs/mobile-app.md "Minimum WebView"). ES5 only: it
      // must run on the engines it rejects, where the module bundle is a
      // SyntaxError and the app would otherwise boot to a blank screen.
      (function () {
        var css = window.CSS;
        if (css && css.supports && css.supports('color', 'oklch(0 0 0)')) return;
        var root = document.querySelector('app-root');
        if (!root) return;
        var m = /Chrome\/(\d+)/.exec(navigator.userAgent);
        var box = document.createElement('div');
        box.id = 'engine-too-old';
        box.setAttribute('style', 'max-width:28rem;margin:20vh auto 0;padding:0 1.5rem;font-family:sans-serif;line-height:1.5;color:#f4f4f5');
        var h = document.createElement('h1');
        h.setAttribute('style', 'font-size:1.25rem');
        h.textContent = 'This browser engine is too old for NicotinD';
        var p = document.createElement('p');
        p.textContent =
          'NicotinD needs Android System WebView or Chrome 111 or newer' +
          (m ? ' (this device has ' + m[1] + ')' : '') +
          '. Update Android System WebView or Chrome, then reopen the app.';
        box.appendChild(h);
        box.appendChild(p);
        root.parentNode.replaceChild(box, root);
      })();
    </script>
  </body>
</html>
