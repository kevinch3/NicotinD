
@if (visible()) {
  <section class="mb-8" data-testid="review-inbox">
    <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-theme-muted">
        {{ 'review.title' | t }}
      </h2>
      <!-- Bulk sweep (issue #592): a 34-album queue was only clearable one card
           at a time. Both are confirmed; discard deletes files. -->
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="approveAll()"
          [disabled]="bulkBusy()"
          data-testid="review-approve-all"
          class="status-done rounded-full px-3 py-1.5 text-xs font-medium transition hover:opacity-90 disabled:opacity-50"
        >
          {{ 'review.approveAll' | t: { count: queue().length } }}
        </button>
        <button
          type="button"
          (click)="discardAll()"
          [disabled]="bulkBusy()"
          data-testid="review-discard-all"
          class="rounded-full border border-theme px-3 py-1.5 text-xs font-medium text-status-error transition hover:border-status-error disabled:opacity-50"
        >
          {{ 'review.discardAll' | t: { count: queue().length } }}
        </button>
      </div>
    </div>

    <div class="space-y-3">
      @for (album of queue(); track album.albumId) {
        <!-- Stacks on a phone (issue #592): the actions used to sit in a
             `shrink-0` row whose ~300px minimum overflowed a 360px viewport and
             clipped Discard off the right edge. -->
        <div
          class="flex flex-col gap-3 rounded-lg border border-theme bg-theme-surface/30 p-3 sm:flex-row sm:items-center sm:gap-4"
          data-testid="review-album"
        >
          <div class="flex min-w-0 flex-1 items-center gap-3 sm:gap-4">
            <app-cover-art
              [src]="coverUrl(album)"
              [artist]="album.albumArtist"
              [album]="album.albumTitle"
              [size]="56"
              rounded="rounded"
            />

            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium text-theme-primary">
                {{ album.albumArtist }} — {{ album.albumTitle }}@if (album.year) {
                  <span> ({{ album.year }})</span>
                }
              </p>
              <p class="text-xs text-theme-muted">
                {{ 'review.tracks' | t: { count: album.songs.length } }}
              </p>

              <div class="mt-2 flex flex-wrap gap-1">
                @for (step of stepKeys; track step) {
                  <span
                    class="rounded-full px-1.5 py-0.5 text-[10px] leading-none"
                    [class.status-done]="stepsFor(album)[step] === 'done'"
                    [class.bg-theme-surface-2]="stepsFor(album)[step] === 'pending'"
                    [class.text-theme-muted]="stepsFor(album)[step] === 'pending'"
                    [class.status-error]="stepsFor(album)[step] === 'skipped'"
                    [class.line-through]="stepsFor(album)[step] === 'skipped'"
                  >
                    {{ step }}
                  </span>
                }
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-2 sm:shrink-0">
            <button
              type="button"
              (click)="listen(album)"
              [disabled]="bulkBusy() || busyAlbums().has(album.albumId)"
              data-testid="review-listen"
              class="rounded-full border border-theme px-3 py-1.5 text-xs font-medium text-theme-secondary transition hover:border-theme hover:text-theme-primary disabled:opacity-50"
            >
              {{ 'review.listen' | t }}
            </button>
            <button
              type="button"
              (click)="fix(album)"
              [disabled]="bulkBusy() || busyAlbums().has(album.albumId)"
              data-testid="review-fix"
              class="rounded-full border border-theme px-3 py-1.5 text-xs font-medium text-theme-secondary transition hover:border-theme hover:text-theme-primary disabled:opacity-50"
            >
              {{ 'review.fix' | t }}
            </button>
            <button
              type="button"
              (click)="approve(album)"
              [disabled]="bulkBusy() || busyAlbums().has(album.albumId)"
              data-testid="review-approve"
              class="status-done rounded-full px-3 py-1.5 text-xs font-medium transition hover:opacity-90 disabled:opacity-50"
            >
              {{ 'review.approve' | t }}
            </button>
            <button
              type="button"
              (click)="discard(album)"
              [disabled]="bulkBusy() || busyAlbums().has(album.albumId)"
              data-testid="review-discard"
              class="rounded-full border border-theme px-3 py-1.5 text-xs font-medium text-status-error transition hover:border-status-error disabled:opacity-50"
            >
              {{ 'review.discard' | t }}
            </button>
          </div>
        </div>
      }
    </div>
  </section>
}
