<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  [attr.fill]="filled() ? 'currentColor' : 'none'"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"

      <path d="m12 19-7-7 7-7" />
      <path d="M19 12H5" />
    }
    @case ('play') {
