<div class="flex flex-col items-center gap-2 mb-6 -mt-2" data-testid="radio-chip">
  <div
    [class]="'inline-flex items-stretch rounded-full text-xs font-medium transition border ' + (player.radio() ? 'text-theme-accent-text border-theme-accent/40 bg-theme-accent/15' : 'text-theme-muted border-theme-surface-2')"
  >
    <button
      appTvNavItem
      type="button"
      (click)="player.toggleRadio()"
      data-testid="now-playing-radio"
      [attr.aria-pressed]="player.radio()"
      class="flex items-center gap-2 pl-3 pr-2 py-1.5 rounded-l-full hover:text-theme-secondary"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="2" /><path d="M4.93 19.07a10 10 0 010-14.14M7.76 16.24a6 6 0 010-8.48M16.24 7.76a6 6 0 010 8.48M19.07 4.93a10 10 0 010 14.14" />
      </svg>
      {{ (player.radio() ? 'nowPlaying.radioOn' : 'nowPlaying.radio') | t }}
    </button>
    <button
      appTvNavItem
      type="button"
      (click)="toggleExpanded()"
      data-testid="radio-chip-expand"
      [attr.aria-expanded]="expanded()"
      aria-controls="radio-chip-panel"
      [attr.aria-label]="'nowPlaying.radioOptions' | t"
      class="flex items-center px-2 rounded-r-full border-l border-current/20 hover:text-theme-secondary"
    >
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="transition-transform"
        [style.transform]="expanded() ? 'rotate(180deg)' : 'rotate(0deg)'"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>
  </div>

  @if (expanded()) {
    <div
      id="radio-chip-panel"
      data-testid="radio-chip-panel"
      class="w-full max-w-sm rounded-xl border border-theme bg-theme-surface/70 px-4 py-3 flex flex-col gap-3"
    >
      <p class="text-xs text-theme-secondary text-center truncate" data-testid="radio-chip-description">
        {{ description() }}
      </p>
      <!-- The D-pad group wraps the radiogroup rather than being it: the nav
           directive owns the host's role, and a radiogroup must announce as one. -->
      <div appTvNavGroup [axis]="'horizontal'">
      <div
        role="radiogroup"
        data-testid="radio-variety"
        [attr.aria-label]="'nowPlaying.variety' | t"
        (keydown)="onKeydown($event)"
        class="grid grid-cols-3 gap-1 rounded-full bg-theme-surface-2/60 p-1"
      >
        @for (v of VARIETIES; track v) {
          <button
            appTvNavItem
            type="button"
            role="radio"
            [attr.data-testid]="'radio-variety-' + v"
            [attr.aria-checked]="variety() === v"
            (click)="select(v)"
            [class]="'px-2 py-1.5 rounded-full text-xs transition ' + (variety() === v ? 'bg-theme-accent/25 text-theme-accent-text font-medium' : 'text-theme-muted hover:text-theme-secondary')"
          >
            {{ labelKey(v) | t }}
          </button>
        }
      </div>
      </div>
      <p class="text-[11px] text-theme-muted text-center">{{ 'nowPlaying.varietyHint' | t }}</p>
    </div>
  }
</div>
