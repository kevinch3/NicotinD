<div class="px-4 mb-4 md:px-8">
  @if (!isTv) {
    <app-now-playing-waveform
      [waveform]="waveform()"
      [progress]="progress()"
      [duration]="duration()"
      (seek)="seek.emit($event)"
    />
  }
  <app-seek-bar [position]="progress()" [duration]="duration()" [buffered]="buffered()" (seek)="seek.emit($event)" />
  <div class="flex justify-between mt-1.5">
    <span class="text-xs text-theme-muted">{{ formatTime(progress()) }}</span>
    <span class="text-xs text-theme-muted">{{ formatTime(duration()) }}</span>
  </div>
</div>

<!-- Prev / play / next, and nothing else: shuffle and repeat are not in the UI
     on any surface (docs/web-ui.md). The radio chip below is what "surprise me"
     means here. -->
<div class="flex items-center justify-center gap-6 mb-6" appTvNavGroup [axis]="'horizontal'">
  <button appTvNavItem (click)="prevClicked.emit()" [attr.aria-label]="'nowPlaying.previous' | t" class="w-[3.125rem] h-[3.125rem] flex items-center justify-center text-theme-secondary hover:text-theme-primary transition">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="3" height="14" /><polygon points="21,5 9,12 21,19" /></svg>
  </button>

  <button
    appTvNavItem
    (click)="playPauseClicked.emit()"
    data-testid="now-playing-playpause"
    [attr.aria-label]="(playing() ? 'nowPlaying.pause' : 'nowPlaying.play') | t"
    [attr.data-buffering]="buffering()"
    class="w-[4.375rem] h-[4.375rem] rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
  >
    @if (buffering()) {
      <span class="inline-block w-7 h-7 border-[3px] border-current border-t-transparent rounded-full animate-spin"></span>
    } @else if (playing()) {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
    } @else {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21" /></svg>
    }
  </button>

  <button appTvNavItem (click)="nextClicked.emit()" [attr.aria-label]="'nowPlaying.next' | t" class="w-[3.125rem] h-[3.125rem] flex items-center justify-center text-theme-secondary hover:text-theme-primary transition">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="3,5 15,12 3,19" /><rect x="18" y="5" width="3" height="14" /></svg>
  </button>
</div>

<app-radio-chip />
