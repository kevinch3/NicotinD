<div class="px-4 mb-4 md:px-8">
  <app-seek-bar
    [position]="progress()"
    [duration]="duration()"
    [buffered]="buffered()"
    (seek)="seek.emit($event)"
  />
  <div class="flex justify-between mt-1.5">
    <span class="text-xs text-theme-muted">{{ formatTime(progress()) }}</span>
    <span class="text-xs text-theme-muted">{{ formatTime(duration()) }}</span>
  </div>
</div>

<div class="flex items-center justify-center gap-6 mb-6" appTvNavGroup [axis]="'horizontal'">
  @if (!isTv) {
    <!-- Active state is a solid fill, never color alone — a tinted glyph is
         invisible on grayscale (e-ink) displays; w-7 keeps shuffle/repeat
         secondary to the prev/play/next row. -->
    <button
      appTvNavItem
      (click)="player.toggleShuffle()"
      data-testid="now-playing-shuffle"
      [attr.aria-label]="(player.shuffle() ? 'nowPlaying.shuffleOff' : 'nowPlaying.shuffleOn') | t"
      [attr.aria-pressed]="player.shuffle()"
      [class]="
        'w-7 h-7 flex items-center justify-center rounded-full transition ' +
        (player.shuffle()
          ? 'bg-theme-accent text-theme-on-accent'
          : 'text-theme-muted hover:text-theme-secondary')
      "
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M16 3h5v5" />
        <path d="M4 20 21 3" />
        <path d="M21 16v5h-5" />
        <path d="M15 15l6 6" />
        <path d="M4 4l5 5" />
      </svg>
    </button>
  }

  <button
    appTvNavItem
    (click)="prevClicked.emit()"
    [attr.aria-label]="'nowPlaying.previous' | t"
    class="w-10 h-10 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <rect x="3" y="5" width="3" height="14" />
      <polygon points="21,5 9,12 21,19" />
    </svg>
  </button>

  <button
    appTvNavItem
    (click)="playPauseClicked.emit()"
    data-testid="now-playing-playpause"
    [attr.aria-label]="(playing() ? 'nowPlaying.pause' : 'nowPlaying.play') | t"
    [attr.data-buffering]="buffering()"
    class="w-14 h-14 rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
  >
    @if (buffering()) {
      <span
        class="inline-block w-6 h-6 border-[3px] border-current border-t-transparent rounded-full animate-spin"
      ></span>
    } @else if (playing()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16" />
        <rect x="14" y="4" width="4" height="16" />
      </svg>
    } @else {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6,3 20,12 6,21" />
      </svg>
    }
  </button>

  <button
    appTvNavItem
    (click)="nextClicked.emit()"
    [attr.aria-label]="'nowPlaying.next' | t"
    class="w-10 h-10 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="3,5 15,12 3,19" />
      <rect x="18" y="5" width="3" height="14" />
    </svg>
  </button>

  @if (!isTv) {
    <button
      appTvNavItem
      (click)="player.cycleRepeat()"
      data-testid="now-playing-repeat"
      [attr.aria-label]="
        (player.repeat() === 'one'
          ? 'nowPlaying.repeatOne'
          : player.repeat() === 'all'
            ? 'nowPlaying.repeatAll'
            : 'nowPlaying.repeatOff'
        ) | t
      "
      [attr.aria-pressed]="player.repeat() !== 'off'"
      [class]="
        'w-7 h-7 flex items-center justify-center rounded-full transition relative ' +
        (player.repeat() !== 'off'
          ? 'bg-theme-accent text-theme-on-accent'
          : 'text-theme-muted hover:text-theme-secondary')
      "
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17 2l4 4-4 4" />
        <path d="M3 11v-1a4 4 0 014-4h14" />
        <path d="M7 22l-4-4 4-4" />
        <path d="M21 13v1a4 4 0 01-4 4H3" />
      </svg>
      @if (player.repeat() === 'one') {
        <span
          class="absolute -top-1 -right-1 text-[10px] font-bold leading-none rounded-full px-[3px] bg-theme-accent text-theme-on-accent"
          >1</span
        >
      }
    </button>
  }
</div>

<div class="flex justify-center mb-6 -mt-2">
  <button
    appTvNavItem
    (click)="player.toggleRadio()"
    data-testid="now-playing-radio"
    [attr.aria-pressed]="player.radio()"
    [class]="
      'flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium transition border ' +
      (player.radio()
        ? 'bg-theme-accent text-theme-on-accent border-theme-accent'
        : 'text-theme-muted border-theme-surface-2 hover:text-theme-secondary')
    "
  >
    <svg
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="2" />
      <path
        d="M4.93 19.07a10 10 0 010-14.14M7.76 16.24a6 6 0 010-8.48M16.24 7.76a6 6 0 010 8.48M19.07 4.93a10 10 0 010 14.14"
      />
    </svg>
    {{ (player.radio() ? 'nowPlaying.radioOn' : 'nowPlaying.radio') | t }}
  </button>
</div>
