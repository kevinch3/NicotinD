<div class="px-4 mb-4 md:px-8">
  @if (!isTv) {
    <app-now-playing-waveform
      [waveform]="waveform()"
      [progress]="progress()"
      [duration]="duration()"
      (seek)="seek.emit($event)"
    />
  }
  <app-seek-bar [position]="progress()" [duration]="duration()" [buffered]="buffered()" (seek)="seek.emit($event)" />
  <div class="flex justify-between mt-1.5">
    <span class="text-xs text-theme-muted">{{ formatTime(progress()) }}</span>
    <span class="text-xs text-theme-muted">{{ formatTime(duration()) }}</span>
  </div>
</div>

<!-- Prev / play / next between Like and the radio control: shuffle and repeat
     are not in the UI on any surface (docs/web-ui.md). Radio is what "surprise
     me" means here. -->
<div class="flex items-center justify-center mb-6" [class]="isTv ? 'gap-6' : 'gap-4'" appTvNavGroup [axis]="'horizontal'">
  @if (!isTv && player.currentTrack(); as track) {
    <!-- Layout B (#1715, #1716): Like leads the transport row and the radio
         control closes it, both 44px and in thumb reach. TV keeps its pinned
         D-pad row (prev / play / next) and the radio chip below. -->
    <button
      type="button"
      appHaptic
      (click)="toggleLike(track.id)"
      data-testid="now-playing-like"
      [attr.aria-pressed]="likes.isLiked(track.id)"
      [attr.aria-label]="(likes.isLiked(track.id) ? 'nowPlaying.unlike' : 'nowPlaying.like') | t"
      [attr.title]="(likes.isLiked(track.id) ? 'nowPlaying.unlike' : 'nowPlaying.like') | t"
      [class]="'w-11 h-11 flex items-center justify-center rounded-full transition ' + (likes.isLiked(track.id) ? 'text-rose-500' : 'text-theme-muted hover:text-rose-400')"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" [attr.fill]="likes.isLiked(track.id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>
  }
  <button appTvNavItem appHaptic (click)="prevClicked.emit()" data-testid="now-playing-prev" [attr.aria-label]="'nowPlaying.previous' | t" class="w-[3.125rem] h-[3.125rem] flex items-center justify-center text-theme-secondary hover:text-theme-primary transition">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="3" height="14" /><polygon points="21,5 9,12 21,19" /></svg>
  </button>

  <button
    appTvNavItem
    appHaptic
    (click)="playPauseClicked.emit()"
    data-testid="now-playing-playpause"
    [attr.aria-label]="(playing() ? 'nowPlaying.pause' : 'nowPlaying.play') | t"
    [attr.data-buffering]="buffering()"
    class="w-[4.375rem] h-[4.375rem] rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
  >
    @if (buffering()) {
      <span class="inline-block w-7 h-7 border-[3px] border-current border-t-transparent rounded-full animate-spin"></span>
    } @else if (playing()) {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
    } @else {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21" /></svg>
    }
  </button>

  <button appTvNavItem appHaptic (click)="nextClicked.emit()" data-testid="now-playing-next" [attr.aria-label]="'nowPlaying.next' | t" class="w-[3.125rem] h-[3.125rem] flex items-center justify-center text-theme-secondary hover:text-theme-primary transition">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="3,5 15,12 3,19" /><rect x="18" y="5" width="3" height="14" /></svg>
  </button>
  @if (!isTv) {
    <app-np-radio-control />
  }
</div>

@if (isTv) {
  <app-radio-chip />
}
