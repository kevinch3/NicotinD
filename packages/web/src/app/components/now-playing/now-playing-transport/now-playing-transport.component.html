<div class="px-4 mb-4 md:px-8">
  @if (!isTv) {
    <app-now-playing-waveform
      [waveform]="waveform()"
      [progress]="progress()"
      [duration]="duration()"
      (seek)="seek.emit($event)"
    />
  }
  <app-seek-bar [position]="progress()" [duration]="duration()" [buffered]="buffered()" (seek)="seek.emit($event)" />
  <div class="flex justify-between mt-1.5">
    <span class="text-xs text-theme-muted">{{ formatTime(progress()) }}</span>
    <span class="text-xs text-theme-muted">{{ formatTime(duration()) }}</span>
  </div>
</div>

<div class="flex items-center justify-center gap-6 mb-6" appTvNavGroup [axis]="'horizontal'">
  @if (!isTv) {
    <!-- Tap toggles shuffle; hold starts a radio from this track (#995). The
         hold is announced in the tooltip and the aria-label, because a gesture
         nobody is told about is a gesture nobody finds. -->
    <button
      appTvNavItem
      (click)="onShuffleClick()"
      (pointerdown)="onShufflePointerDown()"
      (pointerup)="onShufflePointerUp()"
      (pointerleave)="onShufflePointerCancel()"
      (pointercancel)="onShufflePointerCancel()"
      data-testid="now-playing-shuffle"
      [attr.title]="'nowPlaying.shuffleHoldHint' | t"
      [attr.aria-label]="
        ((player.shuffle() ? 'nowPlaying.shuffleOff' : 'nowPlaying.shuffleOn') | t) +
        ' — ' +
        ('nowPlaying.shuffleHoldHint' | t)
      "
      [attr.aria-pressed]="player.shuffle()"
      [class]="'w-8 h-8 flex items-center justify-center rounded-full transition touch-none ' + (player.shuffle() ? 'text-theme-accent-text' : 'text-theme-muted hover:text-theme-secondary')"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5" /><path d="M4 20 21 3" /><path d="M21 16v5h-5" /><path d="M15 15l6 6" /><path d="M4 4l5 5" />
      </svg>
    </button>
  }

  <button appTvNavItem (click)="prevClicked.emit()" [attr.aria-label]="'nowPlaying.previous' | t" class="w-10 h-10 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="3" height="14" /><polygon points="21,5 9,12 21,19" /></svg>
  </button>

  <button
    appTvNavItem
    (click)="playPauseClicked.emit()"
    data-testid="now-playing-playpause"
    [attr.aria-label]="(playing() ? 'nowPlaying.pause' : 'nowPlaying.play') | t"
    [attr.data-buffering]="buffering()"
    class="w-14 h-14 rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
  >
    @if (buffering()) {
      <span class="inline-block w-6 h-6 border-[3px] border-current border-t-transparent rounded-full animate-spin"></span>
    } @else if (playing()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
    } @else {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21" /></svg>
    }
  </button>

  <button appTvNavItem (click)="nextClicked.emit()" [attr.aria-label]="'nowPlaying.next' | t" class="w-10 h-10 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="3,5 15,12 3,19" /><rect x="18" y="5" width="3" height="14" /></svg>
  </button>

  @if (!isTv) {
    <button
      appTvNavItem
      (click)="player.cycleRepeat()"
      data-testid="now-playing-repeat"
      [attr.aria-pressed]="player.repeat() !== 'off'"
      [class]="'w-8 h-8 flex items-center justify-center rounded-full transition relative ' + (player.repeat() !== 'off' ? 'text-theme-accent-text' : 'text-theme-muted hover:text-theme-secondary')"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2l4 4-4 4" /><path d="M3 11v-1a4 4 0 014-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v1a4 4 0 01-4 4H3" />
      </svg>
      @if (player.repeat() === 'one') {
        <span class="absolute -top-1 -right-1 text-[10px] font-bold text-theme-accent-text">1</span>
      }
    </button>
  }
</div>

<app-radio-chip />
