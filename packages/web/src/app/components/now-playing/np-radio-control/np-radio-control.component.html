<ng-template #radioIcon let-size="size">
  <svg [attr.width]="size" [attr.height]="size" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="2" /><path d="M4.93 19.07a10 10 0 010-14.14M7.76 16.24a6 6 0 010-8.48M16.24 7.76a6 6 0 010 8.48M19.07 4.93a10 10 0 010 14.14" />
  </svg>
</ng-template>

<!-- The dial: the chip's expanded panel. Its switch row is where radio is
     turned off: on, the transport icon opens the dial rather than toggling. -->
<ng-template #dial>
  <div
    data-testid="radio-chip-panel"
    class="w-72 max-w-[calc(100vw-2rem)] rounded-xl border border-theme bg-theme-surface shadow-xl px-4 py-3 flex flex-col gap-3"
  >
    <div class="flex items-center justify-between gap-3">
      <span class="flex items-center gap-2 text-sm font-medium" [class]="player.radio() ? 'text-theme-accent-text' : 'text-theme-secondary'">
        <ng-container *ngTemplateOutlet="radioIcon; context: { size: 16 }" />
        {{ (player.radio() ? 'nowPlaying.radioOn' : 'nowPlaying.radio') | t }}
      </span>
      <button
        type="button"
        role="switch"
        data-testid="np-radio-switch"
        [attr.aria-checked]="player.radio()"
        [attr.aria-label]="'nowPlaying.radio' | t"
        (click)="player.toggleRadio()"
        [class]="'relative w-11 h-6 rounded-full transition-colors ' + (player.radio() ? 'bg-theme-accent' : 'bg-theme-surface-2')"
      >
        <span
          class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform"
          [style.transform]="player.radio() ? 'translateX(20px)' : null"
        ></span>
      </button>
    </div>
    <p appOverflowReveal class="text-xs text-theme-secondary truncate" data-testid="radio-chip-description">
      {{ description() }}
    </p>
    <div
      role="radiogroup"
      data-testid="radio-variety"
      [attr.aria-label]="'nowPlaying.variety' | t"
      (keydown)="onKeydown($event)"
      class="grid grid-cols-3 gap-1 rounded-full bg-theme-surface-2/60 p-1"
    >
      @for (v of VARIETIES; track v) {
        <button
          type="button"
          role="radio"
          [attr.data-testid]="'radio-variety-' + v"
          [attr.aria-checked]="variety() === v"
          (click)="select(v)"
          [class]="'px-2 py-1.5 rounded-full text-xs transition ' + (variety() === v ? 'bg-theme-accent/25 text-theme-accent-text font-medium' : 'text-theme-muted hover:text-theme-secondary')"
        >
          {{ labelKey(v) | t }}
        </button>
      }
    </div>
    <p class="text-[11px] text-theme-muted" data-testid="radio-chip-hint">{{ 'nowPlaying.varietyHint' | t }}</p>
    @if (provenanceLabel()) {
      <p class="text-[10px] text-theme-muted/80 font-mono tracking-tight" data-testid="radio-chip-provenance">
        {{ provenanceLabel() }}
      </p>
    }
  </div>
</ng-template>

<!-- One 44px icon. Off: a tap starts the radio. On: a tap opens the dial
     (which holds the off switch); the dot under it says "on" without text. -->
@if (!player.radio()) {
  <button
    type="button"
    data-testid="now-playing-radio"
    (click)="player.toggleRadio()"
    aria-pressed="false"
    [attr.aria-label]="'nowPlaying.radio' | t"
    [attr.title]="'nowPlaying.radio' | t"
    class="w-11 h-11 flex items-center justify-center rounded-full text-theme-muted hover:text-theme-primary transition"
  >
    <ng-container *ngTemplateOutlet="radioIcon; context: { size: 24 }" />
  </button>
} @else {
  <app-menu-panel #mp align="end" panelTestId="np-radio-dial" class="flex">
    <button
      menuTrigger
      type="button"
      data-testid="now-playing-radio"
      aria-pressed="true"
      aria-haspopup="dialog"
      [attr.aria-expanded]="mp.open()"
      [attr.aria-label]="('nowPlaying.radioOn' | t) + ' — ' + ('nowPlaying.radioOptions' | t)"
      [attr.title]="'nowPlaying.radioOptions' | t"
      class="relative w-11 h-11 flex items-center justify-center rounded-full text-theme-accent-text bg-theme-accent/15 transition"
    >
      <ng-container *ngTemplateOutlet="radioIcon; context: { size: 24 }" />
      <span class="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-theme-accent" aria-hidden="true"></span>
    </button>
    <div menuPanel><ng-container *ngTemplateOutlet="dial" /></div>
  </app-menu-panel>
}
