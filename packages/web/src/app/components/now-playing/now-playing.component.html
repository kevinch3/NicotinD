@if (player.currentTrack(); as track) {
  <div
    [class]="'fixed inset-0 z-[60] bg-theme-base ease-out flex flex-col ' +
      (dragging() ? 'transition-none ' : 'transition-transform duration-300 ') +
      (player.nowPlayingOpen() ? 'translate-y-0' : 'translate-y-full')"
    [style.transform]="dragOffsetPx() > 0 ? 'translateY(' + dragOffsetPx() + 'px)' : null"
  >
    <app-now-playing-header (dragPointerDown)="onSheetDragStart($event)" />

    <app-now-playing-cover-art
      [coverMaxPx]="coverMaxPx()"
      [resizing]="resizingQueue()"
      (openTrackInfo)="onOpenTrackInfo($event)"
      (titleContextMenu)="onTitleContextMenu($event)"
      (navigateToArtistClicked)="navigateToArtist()"
    />

    <app-now-playing-transport
      [progress]="safeProgress()"
      [duration]="safeDuration()"
      [buffered]="player.bufferedRanges()"
      [playing]="showPlaying()"
      [buffering]="showBuffering()"
      [autoplayBlocked]="player.autoplayBlocked()"
      (seek)="onSeek($event)"
      (unblockAutoplay)="unblockAutoplay()"
      (playPauseClicked)="handlePlayPause()"
      (nextClicked)="handleNext()"
      (prevClicked)="handlePrev()"
    />

    @if (contextMenu(); as pos) {
      <app-track-context-menu
        [artist]="track.artist"
        [position]="pos"
        [trackId]="track.id"
        (close)="contextMenu.set(null)"
        (openInfo)="onOpenTrackInfo($event)"
      />
    }

    @if (!karaokeFullscreen()) {
      <!-- Drag handle: pull up to grow the active panel (shrinks the cover).
           Shell-owned and rendered above the tabs so it works on the Queue AND
           Lyrics tabs — inside the queue panel it vanished with the tab switch
           and read as a lost feature. -->
      <div
        (pointerdown)="onQueueResizeStart($event)"
        data-testid="now-playing-queue-resize"
        role="separator"
        aria-orientation="horizontal"
        [attr.aria-label]="'nowPlaying.resizeQueue' | t"
        class="group flex-shrink-0 flex justify-center items-center py-2 cursor-ns-resize touch-none select-none"
      >
        <span
          class="w-10 h-1 rounded-full transition-colors"
          [class]="resizingQueue() ? 'bg-theme-secondary' : 'bg-theme-surface-2 group-hover:bg-theme-muted'"
        ></span>
      </div>

      <app-now-playing-panel-tabs
        [activePanel]="activePanel()"
        [queueCount]="player.queue().length"
        [hasLyrics]="hasLyrics()"
        (panelSelected)="setActivePanel($event)"
      />

      @if (activePanel() === 'lyrics') {
        <app-now-playing-lyrics-panel
          [loading]="lyricsLoading()"
          [lines]="lyricLines()"
          [activeLine]="activeLine()"
          [plainLyrics]="plainLyrics()"
          [error]="lyricsError()"
          [fetching]="fetchingLyrics()"
          (fullscreenRequested)="toggleKaraokeFullscreen()"
          (fetchRequested)="fetchLyricsManually()"
        />
      } @else {
        <app-now-playing-queue-panel />
      }
    } @else {
      <app-now-playing-karaoke-fullscreen
        [colors]="coverColors()"
        [title]="track.title"
        [artist]="track.artist"
        [browsing]="karaokeBrowsing()"
        [loading]="lyricsLoading()"
        [lines]="lyricLines()"
        [activeLine]="activeLine()"
        [plainLyrics]="plainLyrics()"
        [currentLineText]="currentLineText()"
        [nextLineText]="nextLineText()"
        [lineAnimClass]="karaokeLineAnimClass()"
        [vocalsMuted]="player.vocalsMuted()"
        [progress]="safeProgress()"
        [duration]="safeDuration()"
        [buffered]="player.bufferedRanges()"
        [playing]="showPlaying()"
        [buffering]="showBuffering()"
        (exit)="toggleKaraokeFullscreen()"
        (browseToggle)="toggleKaraokeBrowsing()"
        (interaction)="onKaraokeInteraction()"
        (lineSelected)="seekToLine($event)"
        (vocalMuteToggle)="player.toggleVocalMute()"
        (seek)="onSeek($event)"
        (playPauseClicked)="handlePlayPause()"
        (nextClicked)="handleNext()"
        (prevClicked)="handlePrev()"
      />
    }
  </div>
}
