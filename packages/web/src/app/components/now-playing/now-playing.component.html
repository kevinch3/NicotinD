@if (player.currentTrack(); as track) {
  <!-- Root nav group (issue #389): header close, the cover's track-info
       button and the transport's radio button are direct items; the transport
       row / panel tabs / queue register as child groups — one merged vertical
       D-pad sweep across the whole sheet. -->
  <div
    appTvNavGroup
    [axis]="'vertical'"
    [class]="'fixed inset-0 z-[60] bg-theme-base ease-out flex flex-col ' +
      (dragging() ? 'transition-none ' : 'transition-transform duration-300 ') +
      (player.nowPlayingOpen() ? 'translate-y-0' : 'translate-y-full')"
    [style.transform]="dragOffsetPx() > 0 ? 'translateY(' + dragOffsetPx() + 'px)' : null"
    [style.--np-tv-backdrop]="tvBackdropUrl() ? 'url(' + tvBackdropUrl() + ')' : null"
  >
    <app-now-playing-header (dragPointerDown)="onSheetDragStart($event)" />

    @if (isTv && nextUp(); as next) {
      <!-- TV replaces the stacked queue panel with a glanceable Next-up chip;
           it sits left of the header's device switcher (absolute right-0).
           Focusable (issue #399): Enter opens the D-pad queue overlay. -->
      <button
        type="button"
        appTvNavItem
        class="np-tv-next"
        data-testid="now-playing-next-up"
        aria-live="polite"
        (click)="tvQueueOpen.set(true)"
      >
        <span class="np-tv-next-label">{{ 'nowPlaying.nextUp' | t }}</span>
        <span class="np-tv-next-title">{{ next.title }} · {{ next.artist }}</span>
      </button>
      @if (tvQueueOpen()) {
        <app-now-playing-tv-queue
          [queue]="player.queue()"
          (jump)="onTvQueueJump($event)"
          (remove)="onTvQueueRemove($event)"
          (closed)="closeTvQueue()"
        />
      }
    }

    @if (contextMenu(); as pos) {
      <app-track-context-menu
        [artist]="track.artist"
        [position]="pos"
        [trackId]="track.id"
        (close)="contextMenu.set(null)"
        (openInfo)="onOpenTrackInfo($event)"
      />
    }

    <!-- Two-column at lg: cover/transport centered left, queue/lyrics a fixed
         right side panel (Spotify-like). The group wrappers are `contents`
         below lg — every child uses host `display: contents`, so a grid/flex
         on the root would place each child's *inner* element individually;
         real column boxes only exist at lg, leaving the mobile stacked layout
         untouched by construction. -->
    <div class="flex-1 min-h-0 flex flex-col lg:flex-row" data-testid="now-playing-body">
      <div class="contents lg:flex lg:flex-1 lg:min-h-0 lg:flex-col lg:justify-center">
        <app-now-playing-cover-art
          [coverMaxPx]="coverMaxPx()"
          [resizing]="resizingQueue()"
          (openTrackInfo)="onOpenTrackInfo($event)"
          (titleContextMenu)="onTitleContextMenu($event)"
          (navigateToArtistClicked)="navigateToArtist()"
        />

        <app-now-playing-transport
          [progress]="safeProgress()"
          [duration]="safeDuration()"
          [buffered]="player.bufferedRanges()"
          [playing]="showPlaying()"
          [buffering]="showBuffering()"
          [waveform]="waveform()"
          (seek)="onSeek($event)"
          (playPauseClicked)="handlePlayPause()"
          (nextClicked)="handleNext()"
          (prevClicked)="handlePrev()"
        />

        @if (!isTv && !karaokeFullscreen()) {
          <!-- Drag handle: pull up to grow the active panel (shrinks the cover).
               Shell-owned and rendered above the tabs so it works on the Queue AND
               Lyrics tabs — inside the queue panel it vanished with the tab switch
               and read as a lost feature. lg:hidden — a vertical resize is
               meaningless beside the fixed-width side panel; on TV it's a
               pointer-drag affordance a D-pad can't use. -->
          <div
            (pointerdown)="onQueueResizeStart($event)"
            data-testid="now-playing-queue-resize"
            role="separator"
            aria-orientation="horizontal"
            [attr.aria-label]="'nowPlaying.resizeQueue' | t"
            class="lg:hidden group flex-shrink-0 flex justify-center items-center py-2 cursor-ns-resize touch-none select-none"
          >
            <span
              class="w-10 h-1 rounded-full transition-colors"
              [class]="resizingQueue() ? 'bg-theme-secondary' : 'bg-theme-surface-2 group-hover:bg-theme-muted'"
            ></span>
          </div>
        }
      </div>

      @if (!isTv && !karaokeFullscreen()) {
        <div
          class="contents lg:flex lg:flex-col lg:flex-none lg:w-[380px] lg:min-h-0 lg:border-l lg:border-theme"
        >
          <app-now-playing-panel-tabs
            [activePanel]="activePanel()"
            [queueCount]="player.queue().length"
            [hasLyrics]="hasLyrics()"
            (panelSelected)="setActivePanel($event)"
          />

          @if (activePanel() === 'lyrics') {
            <app-now-playing-lyrics-panel
              [loading]="lyricsLoading()"
              [lines]="lyricLines()"
              [activeLine]="activeLine()"
              [plainLyrics]="plainLyrics()"
              [error]="lyricsError()"
              [fetching]="fetchingLyrics()"
              (fullscreenRequested)="toggleKaraokeFullscreen()"
              (fetchRequested)="fetchLyricsManually()"
            />
          } @else {
            <app-now-playing-queue-panel />
          }
        </div>
      }
    </div>

    @if (karaokeFullscreen()) {
      <app-now-playing-karaoke-fullscreen
        [colors]="coverColors()"
        [title]="track.title"
        [artist]="track.artist"
        [browsing]="karaokeBrowsing()"
        [loading]="lyricsLoading()"
        [lines]="lyricLines()"
        [activeLine]="activeLine()"
        [plainLyrics]="plainLyrics()"
        [currentLineText]="currentLineText()"
        [nextLineText]="nextLineText()"
        [lineAnimClass]="karaokeLineAnimClass()"
        [vocalsMuted]="player.vocalsMuted()"
        [vocalMode]="vocalSep.vocalMode()"
        [vocalEtaSec]="vocalSep.etaSec()"
        [vocalQueuePosition]="vocalSep.queuePosition()"
        [progress]="safeProgress()"
        [duration]="safeDuration()"
        [buffered]="player.bufferedRanges()"
        [playing]="showPlaying()"
        [buffering]="showBuffering()"
        [waveform]="waveform()"
        (exit)="toggleKaraokeFullscreen()"
        (browseToggle)="toggleKaraokeBrowsing()"
        (interaction)="onKaraokeInteraction()"
        (lineSelected)="seekToLine($event)"
        (vocalMuteToggle)="player.toggleVocalMute()"
        (seek)="onSeek($event)"
        (playPauseClicked)="handlePlayPause()"
        (nextClicked)="handleNext()"
        (prevClicked)="handlePrev()"
      />
    }
  </div>
}
