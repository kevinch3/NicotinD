<svg
  data-testid="now-playing-waveform"
  class="waveform-strip block w-full h-10 cursor-pointer select-none touch-none"
  [attr.viewBox]="'0 0 ' + viewWidth + ' ' + viewHeight"
  preserveAspectRatio="none"
  aria-hidden="true"
  [attr.data-state]="hasEnvelope() ? 'envelope' : 'baseline'"
  (pointerdown)="onPointerDown($event)"
>
  <g class="waveform-layer waveform-layer-baseline">
    <rect
      x="0"
      [attr.y]="baselineY"
      [attr.width]="viewWidth"
      [attr.height]="baselineHeight"
      rx="1"
      class="fill-current text-theme-muted opacity-35"
    />
    <rect
      x="0"
      [attr.y]="baselineY"
      [attr.width]="viewWidth"
      [attr.height]="baselineHeight"
      rx="1"
      class="fill-current text-theme-accent"
      [style.clip-path]="clip()"
    />
  </g>
  <!-- Transparent at the base, opaque at the peaks (#994). The gradient is
       `objectBoundingBox` so it spans the strip regardless of viewBox units,
       and `currentColor` keeps both stops on the theme colour each layer
       already sets — one gradient serves the muted and the accent layer. -->
  <defs>
    <linearGradient id="wf-fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="1" />
    </linearGradient>
  </defs>
  <g class="waveform-layer waveform-layer-envelope">
    <path
      [attr.d]="path() || null"
      class="text-theme-muted opacity-35"
      fill="url(#wf-fade)"
    />
    <path
      [attr.d]="path() || null"
      class="text-theme-accent"
      fill="url(#wf-fade)"
      [style.clip-path]="clip()"
    />
  </g>
</svg>
