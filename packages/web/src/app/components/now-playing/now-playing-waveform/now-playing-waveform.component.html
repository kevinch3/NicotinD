@if (path()) {
  <svg
    data-testid="now-playing-waveform"
    class="block w-full h-10 cursor-pointer select-none touch-none"
    [attr.viewBox]="'0 0 ' + viewWidth + ' ' + viewHeight"
    preserveAspectRatio="none"
    aria-hidden="true"
    (pointerdown)="onPointerDown($event)"
  >
    <path [attr.d]="path()" class="fill-current text-theme-muted opacity-35" />
    <path
      [attr.d]="path()"
      class="fill-current text-theme-accent"
      [style.clip-path]="'inset(0 ' + (100 - percent()) + '% 0 0)'"
    />
  </svg>
}
