<div class="flex items-center gap-2 px-4 md:px-8 mb-2" appTvNavGroup [axis]="'horizontal'">
  <button
    appTvNavItem
    type="button"
    (click)="panelSelected.emit('queue')"
    data-testid="now-playing-tab-queue"
    [attr.aria-pressed]="activePanel() === 'queue'"
    [class]="'flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition ' +
      (activePanel() === 'queue' ? 'bg-theme-accent/15 text-theme-accent-text' : 'text-theme-muted hover:text-theme-secondary')"
  >
    <span
      class="w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0"
      [class]="activePanel() === 'queue' ? 'bg-theme-accent/15 text-theme-accent-text' : 'bg-theme-surface-2 text-theme-muted'"
      aria-hidden="true"
    >
      <app-icon name="queue" [size]="14" />
    </span>
    <span>{{ 'nowPlaying.nextUp' | t }}</span>
    @if (queueCount() > 0) {
      <span class="text-xs opacity-70">{{ queueCount() }}</span>
    }
  </button>

  <button
    appTvNavItem
    type="button"
    (click)="panelSelected.emit('lyrics')"
    data-testid="now-playing-tab-lyrics"
    [attr.aria-pressed]="activePanel() === 'lyrics'"
    [class]="'relative flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition ' +
      (activePanel() === 'lyrics' ? 'bg-theme-accent/15 text-theme-accent-text' : 'text-theme-muted hover:text-theme-secondary')"
  >
    <span
      class="relative w-6 h-6 rounded-md flex items-center justify-center flex-shrink-0"
      [class]="activePanel() === 'lyrics' ? 'bg-theme-accent/15 text-theme-accent-text' : 'bg-theme-surface-2 text-theme-muted'"
      aria-hidden="true"
    >
      <app-icon name="mic" [size]="14" />
      @if (hasLyrics() && activePanel() !== 'lyrics') {
        <span
          data-testid="now-playing-lyrics-dot"
          class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-theme-accent"
        ></span>
      }
    </span>
    <span>{{ 'nowPlaying.lyrics' | t }}</span>
  </button>
</div>
