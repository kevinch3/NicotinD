<section
  class="rounded-xl border border-theme bg-theme-surface/50 mb-6"
  [attr.data-group-id]="groupId()"
>
  <button
    type="button"
    (click)="toggle()"
    data-testid="settings-group-toggle"
      [attr.aria-label]="(open() ? 'Collapse ' : 'Expand ') + title()"
      [attr.aria-expanded]="open()"
    class="w-full flex items-center gap-2 text-left p-6"
    [attr.aria-expanded]="open()"
  >
    <app-settings-group-header
      [icon]="icon()"
      [title]="title()"
      [description]="description()"
      class="flex-1"
    />
    <span
      class="text-theme-muted transition-transform flex-shrink-0"
      [style.transform]="open() ? 'rotate(180deg)' : 'rotate(0deg)'"
      aria-hidden="true"
    >
      <app-icon name="back" [size]="16" style="transform: rotate(-90deg); display: inline-block" />
    </span>
  </button>

  @if (open()) {
    <div data-testid="settings-group-body" class="px-6 pb-6">
      <ng-content />
    </div>
  }
</section>
