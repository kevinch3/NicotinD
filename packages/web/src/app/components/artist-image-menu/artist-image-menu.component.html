<div class="relative" data-no-p2r (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
  <app-menu-panel #menu align="start">
    <button
      trigger
      type="button"
      [disabled]="busy()"
      data-testid="artist-image-menu-trigger"
      [attr.aria-label]="'Change artist photo'"
      title="Change artist photo"
      [class]="
        compact()
          ? 'w-7 h-7 flex items-center justify-center rounded-full bg-theme-surface/90 border border-theme text-theme-secondary hover:text-theme-primary shadow transition disabled:opacity-50'
          : 'w-8 h-8 flex items-center justify-center rounded-lg text-theme-muted hover:text-theme-secondary hover:bg-theme-surface-2 transition disabled:opacity-50'
      "
    >
      @if (busy()) {
        <span
          class="inline-block w-3.5 h-3.5 border-2 border-theme border-t-zinc-300 rounded-full animate-spin"
        ></span>
      } @else {
        <app-icon name="edit" />
      }
    </button>
    <div
      menuPanel
      class="w-52 p-1.5 rounded-lg bg-theme-surface border border-theme shadow-xl flex flex-col"
    >
      <button
        type="button"
        data-testid="artist-image-upload"
        (click)="triggerUpload()"
        class="text-left px-3 py-2 text-sm rounded-md text-theme-secondary hover:bg-theme-surface-2 transition"
      >
        Upload image…
      </button>
      <button
        type="button"
        data-testid="artist-image-from-album"
        (click)="openAlbumPicker()"
        class="text-left px-3 py-2 text-sm rounded-md text-theme-secondary hover:bg-theme-surface-2 transition"
      >
        Choose from album…
      </button>
      <button
        type="button"
        data-testid="artist-image-auto-fetch"
        (click)="autoFetch()"
        class="text-left px-3 py-2 text-sm rounded-md text-theme-secondary hover:bg-theme-surface-2 transition"
      >
        Fetch automatically
      </button>
      <button
        type="button"
        data-testid="artist-image-reset"
        (click)="reset()"
        class="text-left px-3 py-2 text-sm rounded-md text-theme-secondary hover:bg-theme-surface-2 transition"
      >
        Reset to default
      </button>
    </div>
  </app-menu-panel>

  <input
    #fileInput
    type="file"
    accept="image/jpeg,image/png,image/webp"
    class="hidden"
    data-testid="artist-image-file"
    (change)="onFileSelected($event)"
  />
</div>

@if (albumPickerOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
    data-testid="artist-image-album-picker"
    data-no-p2r
    (click)="closeAlbumPicker()"
    (keydown.escape)="closeAlbumPicker()"
    tabindex="-1"
  >
    <div
      class="w-full max-w-lg max-h-[70vh] overflow-y-auto rounded-xl bg-theme-surface border border-theme p-4"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      tabindex="-1"
    >
      <h2 class="text-sm font-semibold text-theme-primary mb-3">Choose a cover</h2>
      @if (loadingAlbums()) {
        <p class="text-xs text-theme-muted py-6 text-center">Loading albums…</p>
      } @else if (pickable().length === 0) {
        <p class="text-xs text-theme-muted py-6 text-center" data-testid="artist-image-no-albums">
          This artist has no albums with a cover to copy.
        </p>
      } @else {
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
          @for (a of pickable(); track a.id) {
            <button
              type="button"
              [attr.data-testid]="'artist-image-album-' + a.id"
              [disabled]="busy()"
              (click)="pickAlbumCover(a.id)"
              class="flex flex-col gap-1 text-left disabled:opacity-50 hover:opacity-90 transition"
            >
              <app-cover-art
                [src]="
                  a.coverArt ? '/api/cover/' + a.coverArt + '?size=160&token=' + auth.token() : undefined
                "
                [album]="a.name"
                [size]="120"
                rounded="rounded-md"
              />
              <span class="text-xs text-theme-secondary truncate">{{ a.name }}</span>
            </button>
          }
        </div>
      }
    </div>
  </div>
}
