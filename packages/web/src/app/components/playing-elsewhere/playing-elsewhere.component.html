@if (remote.playingElsewhere()) {
  <button
    type="button"
    appTvNavItem
    data-testid="playing-elsewhere"
    [attr.data-controllable]="remote.sessionControllable()"
    [attr.aria-label]="'remote.openSwitcher' | t"
    class="w-full flex items-center gap-2 px-3 md:px-4 py-1.5 text-xs font-semibold text-left
           bg-[var(--theme-accent)] text-[var(--theme-on-accent)] hover:opacity-95 transition
           focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[var(--theme-on-accent)]"
    (click)="open($event)"
    (pointerdown)="$event.stopPropagation()"
  >
    <!-- Speaker -->
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
      <path d="M15.5 8.5a5 5 0 0 1 0 7" />
      <path d="M19 5a9 9 0 0 1 0 14" />
    </svg>
    <span class="truncate" data-testid="playing-elsewhere-name">{{ 'remote.playingOn' | t: { name: name() } }}</span>
    @if (reconnecting()) {
      <span class="flex-shrink-0">· {{ 'remote.reconnecting' | t }}</span>
    }
    @if (!remote.sessionControllable()) {
      <span class="ml-auto truncate" data-testid="playing-elsewhere-uncontrollable">{{ 'remote.notControllable' | t }}</span>
    }
  </button>
}
