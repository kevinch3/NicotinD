@if (shortcuts.helpOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4"
    appBottomChromeSafe
    (click)="close()"
    data-testid="shortcuts-sheet"
  >
    <div
      class="relative w-full max-w-md max-h-[80vh] flex flex-col rounded-xl bg-theme-surface border border-theme shadow-2xl overflow-hidden"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'shortcuts.title' | t"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between p-4 border-b border-theme flex-shrink-0">
        <h2 class="text-base font-semibold text-theme-primary">{{ 'shortcuts.title' | t }}</h2>
        <button
          type="button"
          (click)="close()"
          data-testid="shortcuts-sheet-close"
          class="text-theme-muted hover:text-theme-primary transition flex-shrink-0"
          [attr.aria-label]="'shortcuts.closeSheet' | t"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <ul class="overflow-y-auto p-2">
        @for (row of rows; track row.id) {
          <li class="flex items-center justify-between gap-4 px-2 py-1.5 text-sm" data-testid="shortcuts-row">
            <span class="text-theme-secondary">{{ row.labelKey | t }}</span>
            <span class="flex gap-1 flex-shrink-0">
              @for (key of row.keys; track key) {
                <kbd class="min-w-6 px-1.5 py-0.5 rounded border border-theme bg-theme-surface-2 text-xs text-center text-theme-primary font-mono">{{ key }}</kbd>
              }
            </span>
          </li>
        }
      </ul>
    </div>
  </div>
}
