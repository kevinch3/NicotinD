
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
         appBottomChromeSafe
         (click)="cancel.emit()">
      <div class="bg-theme-surface border border-theme rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl"
           (click)="$event.stopPropagation()">
        <ng-content />
        <p class="text-theme-primary text-sm mb-6">{{ message() }}</p>
        <!-- Options that belong under the question (e.g. #810's "also discard"
             checkbox) — additive slot, existing projectors are unaffected. -->
        <ng-content select="[belowMessage]" />
        <div class="flex gap-3 justify-end">
          <button
            class="px-4 py-2 text-sm text-theme-secondary hover:text-theme-primary rounded-lg transition-colors"
            (click)="cancel.emit()">
            Cancel
          </button>
          <button
            class="px-4 py-2 text-sm status-error hover:opacity-80 rounded-lg transition-colors"
            data-testid="confirm-ok"
            (click)="confirm.emit()">
            {{ confirmLabel() }}
          </button>
        </div>
      </div>
    </div>
