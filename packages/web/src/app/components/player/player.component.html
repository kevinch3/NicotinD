
    <audio #audioElA></audio>
    <audio #audioElB></audio>
    <!-- On TV the player is a route (TvPlayerComponent), not a bar. Only the
         chrome is gated off: the <audio> elements above ARE the playback engine
         — buffering, transcode fallback, false-ended recovery and the media
         session all live in this component, so dropping it entirely from the TV
         shell silently removed audio itself. Keep one engine, fork the UI. -->
    @if (!isTv) {
    <!-- Mobile: floats above the fixed bottom tab bar (h-14 + safe-area inset); desktop: bottom-0 (no tab bar).
         Show/hide geometry lives in lib/player-chrome.ts — the hidden state must clear the tab bar too. -->
    <div #miniChrome data-bottom-chrome [class]="'fixed bottom-[calc(3.5rem+env(safe-area-inset-bottom)-var(--vp-deficit))] md:bottom-[calc(-1*var(--vp-deficit))] left-0 right-0 player-chrome z-50 transition-transform duration-300 ease-out ' +
      (remote.playingElsewhere() ? 'ring-2 ring-inset ring-[var(--theme-accent)] ' : '') +
      slideClass()">

      <!-- "Playing on <device>": the audio is elsewhere; tap to move it. -->
      <app-playing-elsewhere />

      <!-- Grab handle ("notch") — pull up / tap to open Now Playing. Wired to the
           same open gesture as the bar so the visible hatch is actually draggable
           (it had no handler before); `touch-none` keeps the browser from
           reclaiming the vertical swipe as a page scroll. The hatch is a solid,
           full-opacity pill (was a faint 4px `/60` bar that read as invisible at
           the bottom of the screen — the user couldn't tell the player was
           draggable). Its bottom padding is the notch → play-button gap on
           desktop, where the transport column starts at the row's top edge
           (#1743: the raised button used to touch the pill). -->
      <div
        class="flex justify-center pt-2.5 pb-1.5 md:pt-2 md:pb-2.5 touch-none select-none cursor-pointer"
        data-testid="player-grab"
        appTvNavItem
        role="button"
        [attr.aria-label]="'player.openNowPlaying' | t"
        (pointerdown)="onBarPointerDown($event)"
        (click)="openNowPlaying()"
      >
        <div class="w-10 h-1.5 rounded-full bg-theme-muted"></div>
      </div>

      <!-- Tap / swipe-up to open Now Playing. touch-none, like the notch: with
           pan-y the browser reclaimed the vertical pan after ~10px and the swipe
           never reached the threshold, so only the notch worked. Nothing in the
           bar scrolls; the seek range owns its own touch-action. -->
      <div
        class="flex items-center px-3 md:px-4 gap-2 md:gap-4 h-14 md:h-auto md:pb-2 cursor-pointer touch-none"
        (pointerdown)="onBarPointerDown($event)"
      >
        <!-- Track info — mobile: the only growing column (flex-1), so it fills the
             bar and pushes the controls to the right edge (two-column layout);
             desktop: fixed width. -->
        <div
          class="flex items-center gap-3 min-w-0 flex-1 md:flex-none md:w-72"
          data-testid="player-track-info"
        >
          @if (player.currentTrack(); as track) {
            <app-cover-art
              [src]="track.coverArt ? '/api/cover/' + track.coverArt + '?size=80&token=' + auth.mediaToken() : undefined"
              [artist]="track.artist"
              [album]="track.album ?? ''"
              [size]="40"
              rounded="rounded"
              [eager]="true"
              [holdPrevious]="true"
              data-testid="player-cover-art"
            />
          }
          <div class="min-w-0 no-callout" translate="no">
            <p appOverflowReveal="always" class="text-base leading-5 font-medium text-theme-primary truncate" data-testid="player-title">{{ player.currentTrack()?.title }}</p>
            <p appOverflowReveal class="text-sm leading-5 text-theme-secondary truncate" data-testid="player-artist">
              @if (player.currentTrack()?.artists?.length) {
                <app-artist-links [artists]="player.currentTrack()!.artists!" />
              } @else {
                {{ player.currentTrack()?.artist }}
              }
            </p>
          </div>
        </div>

        <!-- Controls — mobile: content-sized, sits at the right edge after the
             track-info column grows; desktop: flex-1 to host the progress bar. -->
        <div class="flex-none md:flex-1 flex flex-col items-center gap-1">
          <app-player-transport-mini
            [playing]="showPlaying()"
            [buffering]="showBuffering()"
            (prevClicked)="handlePrev()"
            (playPauseClicked)="handlePlayPause()"
            (nextClicked)="handleNext()"
          />

          <!-- Progress bar (desktop) -->
          <div class="hidden md:flex items-center gap-2 w-full max-w-md">
            <span class="text-xs tabular-nums text-theme-muted w-10 text-right" data-testid="player-time-current">{{ formatTime(safeProgress()) }}</span>
            <div class="flex-1 player-mini-seek" data-seek data-testid="player-seek">
              <app-seek-bar
                [position]="safeProgress()"
                [duration]="safeDuration()"
                [buffered]="player.bufferedRanges()"
                (seek)="onSeek($event)"
              />
            </div>
            <span class="text-xs tabular-nums text-theme-muted w-10" data-testid="player-time-total">{{ formatTime(safeDuration()) }}</span>
          </div>
        </div>

        <!-- Right side: device switcher — content-sized on every breakpoint, so it
             takes no space when the switcher is hidden (no empty third column). -->
        <div class="flex items-center justify-end md:flex-none md:flex-shrink-0">
          <app-device-switcher />
        </div>
      </div>

      <!-- Mobile progress bar — native range seek (app-seek-bar). Sits inside the
           player, above the tab bar; its data-seek attr keeps the swipe-to-open
           gesture (onBarPointerDown) from hijacking a scrub. `pb-1.5` puts the
           track as far above the bar's edge as below the play button (#1743). -->
      <div class="md:hidden px-3 pb-1.5 player-mini-seek" data-testid="player-mobile-seek">
        <app-seek-bar
          [position]="safeProgress()"
          [duration]="safeDuration()"
          [buffered]="player.bufferedRanges()"
          (seek)="onSeek($event)"
        />
      </div>
    </div>
  
    }
