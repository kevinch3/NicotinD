    <div class="flex items-center gap-1 md:gap-3" appTvNavGroup axis="horizontal">
      <!-- Previous -->
      <button
        appTvNavItem
        appHaptic
        (click)="prevClicked.emit()"
        data-testid="player-prev"
        aria-label="Previous track"
        class="w-11 h-11 md:w-9 md:h-9 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="5" width="3" height="14" />
          <polygon points="21,5 9,12 21,19" />
        </svg>
      </button>

      <!-- Play/Pause. Its filled disc is what sets it apart from prev/next. It
           sits on the row's centre line: the -translate-y-1 lift it had (#1263)
           pushed it into the grab notch above it (#1743). Every button is a 44px
           target on a phone, the #1263 floor; desktop keeps the denser 36/40px. -->
      <button
        appTvNavItem
        appHaptic
        (click)="playPauseClicked.emit()"
        data-testid="player-playpause"
        [attr.aria-label]="playing() ? 'Pause' : 'Play'"
        [attr.data-playing]="playing()"
        [attr.data-buffering]="buffering()"
        class="w-11 h-11 md:w-10 md:h-10 ring-2 ring-theme-surface shadow-md rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
      >
        @if (buffering()) {
          <span class="inline-block w-[1.125rem] h-[1.125rem] border-2 border-current border-t-transparent rounded-full animate-spin"></span>
        } @else if (playing()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21" />
          </svg>
        }
      </button>

      <!-- Next -->
      <button
        appTvNavItem
        appHaptic
        (click)="nextClicked.emit()"
        data-testid="player-next"
        aria-label="Next track"
        class="w-11 h-11 md:w-9 md:h-9 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="3,5 15,12 3,19" />
          <rect x="18" y="5" width="3" height="14" />
        </svg>
      </button>
    </div>
