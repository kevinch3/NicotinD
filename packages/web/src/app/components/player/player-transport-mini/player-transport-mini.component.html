    <div class="flex items-center gap-2 md:gap-3" appTvNavGroup axis="horizontal">
      <!-- Previous -->
      <button
        appTvNavItem
        (click)="prevClicked.emit()"
        data-testid="player-prev"
        aria-label="Previous track"
        class="w-9 h-9 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="5" width="3" height="14" />
          <polygon points="21,5 9,12 21,19" />
        </svg>
      </button>

      <!-- Play/Pause. Raised out of the row and painted over the bar's own
           chrome: at this size it no longer reads as one of three equal
           buttons, and the lift is what says so. `z-10` + the surface ring keep
           the line it crosses from cutting through it. -->
      <button
        appTvNavItem
        (click)="playPauseClicked.emit()"
        data-testid="player-playpause"
        [attr.aria-label]="playing() ? 'Pause' : 'Play'"
        [attr.data-playing]="playing()"
        [attr.data-buffering]="buffering()"
        class="w-10 h-10 -translate-y-1 z-10 ring-2 ring-theme-surface shadow-lg rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
      >
        @if (buffering()) {
          <span class="inline-block w-[1.125rem] h-[1.125rem] border-2 border-current border-t-transparent rounded-full animate-spin"></span>
        } @else if (playing()) {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21" />
          </svg>
        }
      </button>

      <!-- Next -->
      <button
        appTvNavItem
        (click)="nextClicked.emit()"
        data-testid="player-next"
        aria-label="Next track"
        class="w-9 h-9 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="3,5 15,12 3,19" />
          <rect x="18" y="5" width="3" height="14" />
        </svg>
      </button>
    </div>
