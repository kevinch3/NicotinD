<div class="flex items-center gap-2 md:gap-3" appTvNavGroup axis="horizontal">
  <!-- Shuffle - desktop only. Active = solid fill (same idiom as the Now
           Playing sheet), never color alone: a tinted glyph is invisible on
           grayscale (e-ink) displays. -->
  <button
    (click)="player.toggleShuffle()"
    data-testid="player-shuffle"
    [attr.aria-label]="player.shuffle() ? 'Turn shuffle off' : 'Turn shuffle on'"
    [attr.aria-pressed]="player.shuffle()"
    [attr.data-active]="player.shuffle()"
    [class]="
      'hidden md:flex w-7 h-7 items-center justify-center rounded-full transition ' +
      (player.shuffle()
        ? 'bg-theme-accent text-theme-on-accent'
        : 'text-theme-muted hover:text-theme-secondary')
    "
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M16 3h5v5" />
      <path d="M4 20 21 3" />
      <path d="M21 16v5h-5" />
      <path d="M15 15l6 6" />
      <path d="M4 4l5 5" />
    </svg>
  </button>

  <!-- Previous -->
  <button
    appTvNavItem
    (click)="prevClicked.emit()"
    data-testid="player-prev"
    aria-label="Previous track"
    class="w-7 h-7 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <rect x="3" y="5" width="3" height="14" />
      <polygon points="21,5 9,12 21,19" />
    </svg>
  </button>

  <!-- Play/Pause -->
  <button
    appTvNavItem
    (click)="playPauseClicked.emit()"
    data-testid="player-playpause"
    [attr.aria-label]="playing() ? 'Pause' : 'Play'"
    [attr.data-playing]="playing()"
    [attr.data-buffering]="buffering()"
    class="w-8 h-8 rounded-full bg-theme-inverse text-theme-inverse flex items-center justify-center hover:opacity-90 transition"
  >
    @if (buffering()) {
      <span
        class="inline-block w-3.5 h-3.5 border-2 border-current border-t-transparent rounded-full animate-spin"
      ></span>
    } @else if (playing()) {
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16" />
        <rect x="14" y="4" width="4" height="16" />
      </svg>
    } @else {
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,3 19,12 5,21" />
      </svg>
    }
  </button>

  <!-- Next -->
  <button
    appTvNavItem
    (click)="nextClicked.emit()"
    data-testid="player-next"
    aria-label="Next track"
    class="w-7 h-7 flex items-center justify-center text-theme-secondary hover:text-theme-primary transition"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
      <polygon points="3,5 15,12 3,19" />
      <rect x="18" y="5" width="3" height="14" />
    </svg>
  </button>

  <!-- Repeat - desktop only -->
  <button
    (click)="player.cycleRepeat()"
    data-testid="player-repeat"
    [attr.aria-label]="
      player.repeat() === 'one'
        ? 'Repeat one — change repeat mode'
        : player.repeat() === 'all'
          ? 'Repeat all — change repeat mode'
          : 'Repeat off — change repeat mode'
    "
    [attr.aria-pressed]="player.repeat() !== 'off'"
    [attr.data-active]="player.repeat() !== 'off'"
    [class]="
      'hidden md:flex w-7 h-7 items-center justify-center rounded-full transition relative ' +
      (player.repeat() !== 'off'
        ? 'bg-theme-accent text-theme-on-accent'
        : 'text-theme-muted hover:text-theme-secondary')
    "
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M17 2l4 4-4 4" />
      <path d="M3 11v-1a4 4 0 014-4h14" />
      <path d="M7 22l-4-4 4-4" />
      <path d="M21 13v1a4 4 0 01-4 4H3" />
    </svg>
    @if (player.repeat() === 'one') {
      <span
        class="absolute -top-1 -right-1 text-[9px] font-bold leading-none rounded-full px-[3px] bg-theme-accent text-theme-on-accent"
        >1</span
      >
    }
  </button>
</div>
