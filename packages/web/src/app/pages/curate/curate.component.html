<div class="page-shell max-w-3xl">
  <h1 class="page-title mb-4">{{ 'curate.title' | t }}</h1>

  @if (current(); as c) {
    <p class="mb-2 text-sm text-theme-secondary" data-testid="curate-progress">
      {{ index() + 1 }} / {{ total() }}
    </p>
    <app-case-card
      [case]="c"
      [busy]="busy()"
      (choose)="onChoose($event)"
      (skip)="onSkip()"
    />
  } @else {
    <p data-testid="curate-done">
      {{ total() ? ('curate.roundDone' | t) : ('curate.empty' | t) }}
    </p>
    @if (total()) {
      <button type="button" class="mt-3 rounded border border-theme px-3 py-2" data-testid="curate-next-round" (click)="load()">
        {{ 'curate.nextRound' | t }}
      </button>
    }
  }
</div>
