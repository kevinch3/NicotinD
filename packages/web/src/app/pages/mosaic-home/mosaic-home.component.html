<div
  class="absolute inset-0 overflow-hidden"
  data-testid="mosaic-home"
  [class.mosaic-holding]="holding()"
  [class.mosaic-covered]="covered()"
  [style.--mosaic-inset]="tileInsetPx"
>
  @if (loading()) {
    <!-- Shape-matched: scattered squares where the packed field will appear,
         not a list skeleton borrowed from another page. -->
    <app-skeleton variant="mosaic" label="Loading your music" testId="mosaic-skeleton" />
  }

  @if (isEmpty()) {
    <!-- Above the stage (#1739): the stage is absolutely positioned later in
         the DOM, and without its own layer it swallowed the Scan button's click. -->
    <div class="page-shell relative z-10 text-center text-theme-muted" data-testid="mosaic-empty">
      @if (offline()) {
        <!-- Offline with nothing downloaded is a different fact from an empty
             library, and saying "add some music" here would be wrong advice. -->
        <p class="mt-12">You're offline, and nothing is downloaded to this device yet.</p>
      } @else {
        <!-- Where music goes, a scan, and the way to Add (#1739). -->
        <div class="mt-12"><app-empty-library /></div>
      }
    </div>
  }

  <!-- The stage. Its tiles are pooled elements written by the render loop, not
       by Angular; the template only gives it the veil a held tile rises above. -->
  <div
    #stage
    data-testid="mosaic-stage"
    role="group"
    aria-label="Music mosaic — drag to explore, tap a tile to start a radio, press and hold a tile for more"
    class="mosaic-stage-contain absolute inset-x-0 top-0 overflow-hidden touch-none select-none cursor-grab"
    [style.bottom.px]="chromeInset()"
    (pointerdown)="onStagePointerDown($event)"
  >
    <div class="mosaic-veil" aria-hidden="true"></div>
  </div>

  <!-- Depth toward the edges (#1638): one composited layer over the field,
       never a per-tile filter the loop would have to rewrite every frame. -->
  @if (!loading() && !isEmpty()) {
    <div
      class="mosaic-rim absolute inset-x-0 top-0"
      aria-hidden="true"
      data-testid="mosaic-rim"
      [style.bottom.px]="chromeInset()"
    ></div>
  }

  <!-- The same tiles as a real, linear, focusable list. Pooled tiles are
       recycled as they cross the lens, so they can carry no stable focus
       order; this is how keyboard and screen-reader users reach every tile.
       Discovery-cell finds are appended as they surface. -->
  <ul class="sr-only" data-testid="mosaic-tile-list">
    @for (tile of tiles(); track tile.key) {
      <li>
        <button
          type="button"
          data-testid="mosaic-tile-link"
          [attr.data-tile-kind]="tile.kind"
          [disabled]="starting() !== null"
          (click)="start(tile)"
        >
          Start radio from {{ label(tile) }} — {{ tile.subtitle }}
        </button>
      </li>
    }
    @for (tile of discovered(); track tile.key) {
      <li>
        <button
          type="button"
          data-testid="mosaic-tile-link"
          [attr.data-tile-kind]="tile.kind"
          [disabled]="starting() !== null"
          (click)="start(tile)"
        >
          Start radio from {{ label(tile) }} — {{ tile.subtitle }}
        </button>
      </li>
    }
  </ul>
</div>
