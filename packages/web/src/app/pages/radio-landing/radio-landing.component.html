<div class="page-shell max-w-3xl space-y-8" data-testid="radio-landing">
  <!-- Block 1 — Resume your vibe (disappears once tapped) -->
  @if (showResume()) {
    <section data-testid="radio-resume">
      <h2 class="text-lg font-bold text-theme-primary mb-3">{{ 'home.resumeTitle' | t }}</h2>
      <button
        type="button"
        (click)="onResume()"
        data-testid="radio-resume-play"
        class="group flex items-center gap-4 w-full p-3 rounded-xl bg-theme-surface/50 hover:bg-theme-surface-2/60 transition text-left"
      >
        <app-cover-art
          [src]="resumeCoverSrc()"
          [artist]="lastTrack()!.artist"
          [album]="lastTrack()!.album ?? ''"
          [size]="64"
          rounded="rounded-lg"
        />
        <div class="min-w-0 flex-1">
          <p class="text-xs font-medium text-theme-accent-text uppercase tracking-wide">
            {{ 'home.resume' | t }}
          </p>
          <p class="text-sm font-semibold text-theme-primary truncate">{{ lastTrack()!.title }}</p>
          <p class="text-xs text-theme-muted truncate">{{ lastTrack()!.artist }}</p>
        </div>
        <span
          class="shrink-0 flex items-center justify-center w-12 h-12 rounded-full bg-theme-accent text-theme-on-accent group-active:scale-95 transition"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </span>
      </button>
    </section>
  }

  <!-- Block 2 — Keep the vibe: one list-seeded radio generation over the
       recently-played rows below (hides itself alongside them) -->
  <app-keep-vibe [seeds]="recentPlays()" />

  <!-- Block 3 — Taste breakers: random library picks, minus what's just been
       played. The deliberate counterweight to "Keep the vibe" above. -->
  <app-taste-breakers [seeds]="recentPlays()" />

  <!-- Block 4 — Recently played (hides itself when there's no history yet) -->
  <app-recently-played />

  <!-- Block 5 — Tastemakers: curated-playlist blend radios (hides itself when
       no curated playlists exist yet) -->
  <app-tastemakers />

  <!-- Block 6 — Start a radio: two fixed rows of wide colored vibe tiles that
       scroll sideways, then the same tile in its muted tone for genres. -->
  <section data-testid="radio-new-mood">
    <h2 class="text-lg font-bold text-theme-primary mb-1">{{ 'home.start' | t }}</h2>
    <p class="text-sm text-theme-muted mb-4">{{ 'home.startHint' | t }}</p>

    <!-- Fixed 2 rows; grid-flow-col makes the overflow scroll horizontally. -->
    <div class="grid grid-flow-col grid-rows-2 auto-cols-max gap-3 overflow-x-auto pb-2 -mx-1 px-1">
      @for (preset of presets; track preset.id) {
        <app-vibe-tile
          data-testid="radio-preset"
          [attr.data-preset-id]="preset.id"
          [label]="preset.label | t"
          [emoji]="preset.emoji"
          [gradient]="preset.gradient"
          tone="color"
          [wide]="true"
          [disabled]="starting() !== null"
          [busy]="starting() === preset.id"
          (tapped)="startPreset(preset)"
        />
      }
    </div>

    <!-- Genre tiles (top of the library) — same tile, low profile. -->
    @if (genres().length > 0) {
      <p class="text-xs font-semibold text-theme-muted uppercase tracking-wide mt-5 mb-2">
        {{ 'home.genres' | t }}
      </p>
      <div class="flex flex-wrap gap-2">
        @for (genre of genres(); track genre) {
          <app-vibe-tile
            data-testid="radio-genre"
            [label]="genre"
            tone="muted"
            [wide]="false"
            [disabled]="starting() !== null"
            [busy]="starting() === 'genre:' + genre"
            (tapped)="startGenre(genre)"
          />
        }
      </div>
    }
  </section>
</div>
