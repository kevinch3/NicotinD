<div class="page-shell max-w-3xl">
  <h1 class="page-title mb-8">{{ 'admin.title' | t }}</h1>

  <app-user-management-panel />

  <app-library-processing-panel />

  <app-system-health-panel />

  <app-library-maintenance-panel />

  <app-streaming-media-panel />

  <app-backups-data-panel />

  <app-acquisition-automation-panel />

  <app-audit-log-panel />

  <app-settings-group
    groupId="radio-polls"
    icon="headphones"
    [title]="'admin.groupRadioPolls' | t"
    [description]="'admin.groupRadioPollsDesc' | t"
    (opened)="radioPolls.load()"
  >
    <!-- Radio evaluation polls: freeze radio scenarios behind a public link and
         collect anonymous 👍/👎 per suggestion (docs/radio-eval-polls.md).
         Loaded on expand, not on the ServiceReview poll — a dev list, not live status. -->
    <app-radio-polls-card #radioPolls />
  </app-settings-group>
</div>
