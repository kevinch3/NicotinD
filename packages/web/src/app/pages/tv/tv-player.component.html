<div
  class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden"
  data-testid="tv-player"
>
  @if (backdrop(); as bg) {
    <div
      class="absolute inset-0 z-0 bg-cover bg-center"
      [style.background-image]="bg"
      style="filter: blur(56px) brightness(0.45) saturate(1.15); transform: scale(1.12)"
      aria-hidden="true"
    ></div>
  }

  @if (track(); as t) {
    <div class="relative z-10 flex flex-col items-center gap-4 px-[4vw]">
      <app-cover-art
        [src]="t.coverArt ? '/api/cover/' + t.coverArt + '?size=600&token=' + auth.token() : undefined"
        [artist]="t.artist"
        [album]="t.album ?? ''"
        [size]="188"
        rounded="rounded-2xl"
      />
      <div class="text-center min-w-0 max-w-3xl">
        <h1 class="text-2xl font-bold truncate text-white" data-testid="tv-player-title">
          {{ t.title }}
        </h1>
        <p class="text-base text-white/70 truncate">{{ t.artist }}</p>
      </div>

      <!-- Every button centres its icon with flex, as every other icon button in
           the app does: Tailwind's preflight makes an <svg> `display: block`,
           and a block child of a <button> is vertically centred by the
           button's own layout but never horizontally — `text-align: center`
           only reaches inline content. Without this each glyph sat on the left
           edge of its circle, which from the couch reads as the whole row being
           shoved to the right (#1132). -->
      <div
        appTvNavGroup
        [axis]="'horizontal'"
        class="flex items-center gap-6"
        data-testid="tv-transport"
      >
        <button
          appTvNavItem
          type="button"
          (click)="player.playPrev()"
          data-testid="tv-prev"
          aria-label="Previous"
          class="w-14 h-14 rounded-full bg-white/10 text-white flex items-center justify-center
                 focus:outline-none focus-visible:ring-4 focus-visible:ring-white"
        >
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zm3 6l9-6v12z" />
        </svg>
        </button>
        <button
          appTvNavItem
          type="button"
          (click)="togglePlay()"
          data-testid="tv-playpause"
          aria-label="Play or pause"
          class="w-20 h-20 rounded-full bg-white text-black flex items-center justify-center
                 focus:outline-none focus-visible:ring-4 focus-visible:ring-white"
        >
          @if (player.isPlaying()) {
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 5h4v14H7zm6 0h4v14h-4z" />
          </svg>
        } @else {
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        }
        </button>
        <button
          appTvNavItem
          type="button"
          (click)="player.playNext()"
          data-testid="tv-next"
          aria-label="Next"
          class="w-14 h-14 rounded-full bg-white/10 text-white flex items-center justify-center
                 focus:outline-none focus-visible:ring-4 focus-visible:ring-white"
        >
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 6h2v12h-2zm-1 6L6 18V6z" />
        </svg>
        </button>
      </div>

      <p class="text-sm text-white/50" data-testid="tv-seek-hint">{{ 'tv.seekHint' | t }}</p>

      <!-- Below the transport, one vertical group: the queue and the output
           picker. ▼ from play/pause lands here, which is the same path the
           radio chip uses on the phone sheet (docs/tv-ux.md "The button
           contract"). -->
      <div appTvNavGroup [axis]="'vertical'" class="flex flex-col items-center gap-2">
        <!-- Karaoke (#1134): the first row down from the transport, because it
             is what a living room reaches for. Opens the phone's fullscreen
             lyrics overlay, adapted for the remote in TvKaraokeComponent. -->
        <button
          appTvNavItem
          type="button"
          (click)="karaokeOpen.set(true)"
          data-testid="tv-lyrics"
          class="text-sm text-white/60 px-4 py-2 rounded-lg
                 focus:outline-none focus-visible:ring-4 focus-visible:ring-white"
        >
          {{ 'nowPlaying.lyrics' | t }}
        </button>

        @if (nextUp(); as n) {
          <button
            appTvNavItem
            type="button"
            (click)="queueOpen.set(true)"
            data-testid="tv-next-up"
            class="text-sm text-white/60 truncate max-w-2xl px-4 py-2 rounded-lg
                   focus:outline-none focus-visible:ring-4 focus-visible:ring-white"
          >
            {{ 'tv.queue' | t }}: {{ n.title }} · {{ n.artist }}
          </button>
        }

        <!-- Remote playback, stated on the screen that plays the audio (#1128).
             Accent-coloured while the audio is elsewhere, because that is a
             state of the player and not a notification — the same rule the
             phone's "Playing on <device>" strip follows. -->
        <button
          appTvNavItem
          type="button"
          (click)="openDevices()"
          data-testid="tv-remote-row"
          [class]="
            'text-sm truncate max-w-2xl px-4 py-2 rounded-lg focus:outline-none ' +
            'focus-visible:ring-4 focus-visible:ring-white ' +
            (elsewhere() ? 'text-theme-accent-text bg-white/10' : 'text-white/50')
          "
        >
          @if (elsewhere()) {
            {{ 'remote.playingOn' | t: { name: elsewhereName() } }} · {{ 'tv.playHere' | t }}
          } @else {
            {{ 'remote.playOn' | t }}
          }
        </button>
      </div>
    </div>
  }

  @if (karaokeOpen()) {
    <app-tv-karaoke (closed)="closeKaraoke()" />
  }

  @if (queueOpen()) {
    <app-now-playing-tv-queue
      [queue]="player.queue()"
      (jump)="onQueueJump($event)"
      (remove)="onQueueRemove($event)"
      (closed)="queueOpen.set(false)"
    />
  }
</div>
