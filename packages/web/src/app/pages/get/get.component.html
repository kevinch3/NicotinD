<!-- The whole workspace is the drop target: aiming a dragged folder at a small
     rectangle is fiddly, and there is nothing else on this page a file drop
     could plausibly mean. -->
<div
  class="relative"
  (dragenter)="onDragEnter($event)"
  (dragleave)="onDragLeave()"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)">
  @if (dragging()) {
    <div
      class="fixed inset-0 z-40 flex items-center justify-center bg-theme-surface/80 backdrop-blur-sm pointer-events-none"
      data-testid="import-drop-overlay">
      <p class="text-lg text-theme-primary">{{ 'import.dropHint' | t }}</p>
    </div>
  }

<div class="max-w-6xl mx-auto px-4 pt-5 md:px-6 md:pt-8">
  <div class="flex gap-1 p-1 bg-theme-surface-2 rounded-xl max-w-full overflow-x-auto w-fit" data-testid="get-tabs">
    @for (t of tabs; track t.value) {
      <button
        class="relative shrink-0 whitespace-nowrap px-4 py-1.5 text-sm rounded-lg transition-colors"
        [class.bg-theme-surface]="tab() === t.value"
        [class.text-theme-primary]="tab() === t.value"
        [class.text-theme-muted]="tab() !== t.value"
        [attr.data-testid]="t.testid"
        [attr.aria-current]="tab() === t.value ? 'page' : null"
        (click)="setTab(t.value)">
        {{ t.label | t }}
        @if (t.value === 'activity' && activeCount() > 0) {
          <span
            class="ml-1.5 inline-flex items-center justify-center min-w-4 h-4 px-1 rounded-full bg-theme-accent text-[10px] font-bold text-theme-on-accent"
            data-testid="get-tab-downloads-badge">
            {{ activeCount() }}
          </span>
        }
      </button>
    }
  </div>
</div>

@if (canImport()) {
  <div class="max-w-6xl mx-auto px-4 md:px-6 mt-4 flex flex-col gap-3">
    @if (dropSummary(); as s) {
      <app-import-drop-card
        [state]="dropState()"
        [summary]="s"
        [percent]="dropPercent()"
        [error]="dropError()"
        (start)="startImport()"
        (cancel)="dismissDrop()" />
    } @else {
      <button
        type="button"
        class="self-start text-xs text-theme-muted hover:text-theme-primary underline decoration-dotted transition"
        data-testid="import-browse"
        (click)="pickFolder()">
        {{ 'import.dropBrowse' | t }}
      </button>
    }
    <!-- webkitdirectory is the only way to pick a *folder*; it is non-standard
         but universally supported, and the drop path covers browsers without it. -->
    <input
      #folderInput
      type="file"
      class="hidden"
      multiple
      webkitdirectory
      data-testid="import-folder-input"
      (change)="onFolderPicked($event)" />
  </div>
}

@if (tab() === 'add') {
  <app-search />
} @else {
  <app-downloads />
}
</div>
