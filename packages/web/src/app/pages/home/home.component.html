<!-- One switch for both views (#1667): mounted outside the swap, so a toggle
     keeps the node (and its focus) and never moves it. -->
<div data-testid="home-view-switch-anchor" [class]="anchorClass()">
  <app-home-view-switch class="pointer-events-auto" [view]="view()" (viewSelected)="select($event)" />
</div>
<ng-container *ngComponentOutlet="component()" />
