# Opt-in GPU overlay: the analysis sidecar on the GPU, plus the GPU-only
# vocal-separation sidecar (issue #603).
#
# This file is NOT auto-merged by `docker compose` (only docker-compose.yml and
# docker-compose.override.yml are). Enable it explicitly, either per-command:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# or persistently by adding this line to your `.env` (next to the compose file):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
# Why a separate overlay instead of the local override file: the GPU request
# below is a *hard* device reservation — if the host's nvidia-container-runtime
# can't satisfy the GPU injection, the analysis container fails to start (it does
# NOT fall back to CPU at the runtime level; the image's CPU fallback only kicks
# in for a container that actually started). Keeping this out of
# docker-compose.override.yml means a host GPU / nvidia-persistenced problem can
# only affect deploys that explicitly opt in here — it can never wedge the
# default CPU deploy, and recovering never means hand-editing the override file
# that also holds your essential bind mounts.
#
# Requirements on the host (see docs/deployment.md "GPU passthrough on the host —
# nvidia-persistenced vs CDI"): the nvidia-container-runtime must be able to
# inject the GPU — either legacy mode with `nvidia-persistenced` running, or the
# recommended CDI mode. The published analysis image is CPU-only, so this overlay
# also switches the service to build from source with `GPU=1`.
#
# The separator is different: it has no meaningful CPU variant (RTF 4.1x on CPU,
# ~14 min per song), so the published image IS the GPU build and this overlay
# pulls it. It lives only here, never in docker-compose.yml — a CPU deploy must
# not pull a multi-GB torch image to run a permanently-`unavailable` container.
services:
  nicotind:
    environment:
      # Read by the API from the karaoke feature onward; harmless before that.
      NICOTIND_SEPARATOR_URL: http://separator:8000

  analysis:
    build:
      context: packages/analysis
      args:
        GPU: "1"
    # The modern (Compose >= v2.20) way to opt a service into the host's
    # nvidia-container-runtime for GPU access.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # environment:
    #   # DO NOT set TF_GPU_ALLOCATOR: cuda_malloc_async here. It was documented
    #   # as a promising un-measured lever for the idle 7.6 GB allocation; the
    #   # measurement has since been made on the P4000 and the sidecar SEGFAULTS
    #   # at boot ("Failed to create session: Internal: No allocator statistics",
    #   # exit 139) on this TF 2.5 / CUDA 11 / Pascal combination. The real fix
    #   # shipped instead: bounding MusiCNN's batch size, which took the idle
    #   # footprint from 7,631 MiB to 2,235 MiB (issue #605, and
    #   # docs/audio-ml-enrichment.md "Root cause: one model's batch size").
    #   #
    #   # Patches per MusiCNN session run. Default 4 — the measured memory sweet
    #   # spot AND the fastest setting. Raise it only on a host that does not
    #   # share its GPU; 16 costs ~2.3 GB more. 0/-1 are rejected in code (they
    #   # are Essentia's "accumulate every patch" sentinels).
    #   ANALYSIS_MUSICNN_BATCH_SIZE: "4"
    #   # Seconds of no /analyze calls before the sidecar drops its warm-loaded
    #   # models (reloaded lazily, multi-second cost, on the next call). 0 or
    #   # negative disables release entirely.
    #   ANALYSIS_IDLE_RELEASE_SEC: "900"
    #   # Seconds of each track the model-free /descriptors pass analyses
    #   # (issue #641, docs/audio-descriptors.md). CPU budget, not GPU: ~5 s
    #   # per track at 180, ~3 s at 90. Non-positive/garbage → default 180.
    #   ANALYSIS_DESCRIPTOR_SECONDS: "180"

  # Vocal-separation sidecar (packages/separator): BS-RoFormer instrumental
  # stems, on demand, for the karaoke vocal mute. GPU-only by contract — reports
  # `unavailable` without CUDA rather than taking the 14-minute CPU path. No
  # `depends_on` in either direction: the API degrades to the basic center-cancel
  # filter when this is down (docs/vocal-separation.md).
  separator:
    image: ghcr.io/kevinch3/nicotind-separator:${NICOTIND_VERSION:-release}
    user: "1000:1000"
    volumes:
      - music:/data/music:ro
    environment:
      MUSIC_DIR: /data/music
      # Seconds of no /separate calls before the worker process (model + CUDA
      # context, ~3.0 GB VRAM) is stopped; the next call respawns it (~10 s cold
      # start). 0 or negative disables release.
      # SEPARATOR_IDLE_RELEASE_SEC: "900"
      # Longest track the sidecar will separate; longer ones get a 422 before
      # any GPU work. 900 s is ~4 min of GPU at the measured RTF.
      # SEPARATOR_MAX_TRACK_SEC: "900"
      # Never set in prod: allows the 14-minute CPU path for local smoke tests.
      # SEPARATOR_ALLOW_CPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - internal
    restart: unless-stopped
