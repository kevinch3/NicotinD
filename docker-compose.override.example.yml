# Docker Compose local override (EXAMPLE)
#
# Copy to `docker-compose.override.yml` (gitignored) and adjust paths for
# your machine. Docker Compose auto-meres this file with docker-compose.yml
# on `docker compose up`.
#
# This template shows the four common dev customizations:
#   1. Bind-mount your existing music library instead of the named volume
#   2. Bind-mount the NicotinD data dir (secrets, DB) for persistence
#   3. Build the server image from source instead of pulling from GHCR
#   4. Re-enable the admin log viewer's Docker socket mount (removed from the
#      default compose file in 0.4.0 — see the warning at the bottom)
#
# GPU passthrough for the analysis sidecar is deliberately NOT here — it lives in
# its own opt-in overlay, docker-compose.gpu.yml, so a host GPU / nvidia-
# persistenced problem can never wedge the deploy that also carries your essential
# bind mounts below. See that file's header + docs/deployment.md.
#
# Enabling that overlay means naming every file yourself: `-f` (or COMPOSE_FILE)
# switches OFF the automatic merge of this file, and it must come LAST:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#     -f docker-compose.override.yml up -d
#
# Compose merges volumes by container target, last file wins, so the reverse order
# puts the empty `music` named volume back over your bind (#1009).
#
# See docker-compose.yml for the full service definitions this overrides.

services:
  nicotind:
    # Build from the working tree instead of pulling the published image
    # (development, or a fork with no registry). With both `image:` and
    # `build:` set, `docker compose up --build` builds and tags the result
    # under the image name.
    build: .
    # NOTE: compose merges `volumes:` by container TARGET, last file wins — a list
    # here neither appends to nor wipes the base list. That is why the bind below
    # takes over `/data/music` from the named volume, while a base mount this block
    # never names stays exactly as docker-compose.yml declares it.
    volumes:
      - ~/.nicotind:/data/nicotind
      - /path/to/your/music:/data/music
      # SECURITY — the admin log viewer, opt-in from 0.4.0.
      #
      # Bind-mounting /var/run/docker.sock grants this container full Docker API
      # access = host-root-equivalent privilege. The `:ro` flag does NOT help:
      # the Docker API is read-write over the socket regardless of how the file
      # itself is mounted. An RCE or SSRF anywhere in the API therefore
      # escalates straight to root on the host — in a service that fetches
      # remote cover art, parses untrusted audio tags, shells out to
      # ffmpeg/fpcalc and extracts user-supplied zip archives.
      #
      # This was in docker-compose.yml by default until 0.4.0. It moved here
      # because the published image is public, so the default configuration is
      # what strangers run. Without it the log viewer degrades cleanly:
      # GET /api/system/logs returns 503 "Docker socket not available".
      #
      # Uncomment only if you want the admin log viewer and accept that trade.
      # - /var/run/docker.sock:/var/run/docker.sock:ro

  analysis:
    # Just a bind mount here — the published analysis image runs on CPU. For GPU
    # inference, enable docker-compose.gpu.yml instead of adding a device
    # reservation here (see that file's header). That overlay switches this
    # service to build from source with GPU=1 and adds the nvidia device request.
    volumes:
      - /path/to/your/music:/data/music:ro

  slskd:
    volumes:
      - /path/to/your/music:/data/music
    ports:
      - "5030:5030"

  # Opt-in (`profiles: ["slskd-addon"]`) — inert unless you activate that profile,
  # but it reads the library over the same mount, so it needs the bind too.
  # SLSKD_ADDON_MUSIC_DIR points at /data/music; without this it resolves nothing.
  slskd-addon:
    volumes:
      - slskd-addon-data:/data
      - /path/to/your/music:/data/music:ro

  lidarr:
    volumes:
      - /path/to/your/music:/data/music

  # The GPU vocal separator (docs/vocal-separation.md) is defined ONLY in
  # docker-compose.gpu.yml, so this block cannot be live here: CI validates
  # `-f docker-compose.yml -f docker-compose.override.example.yml`, and compose
  # rejects a service the base file never defines. Uncomment it in YOUR copy when
  # you enable that overlay — without it the separator reads the empty named
  # volume and finds no audio (#1009).
  # separator:
  #   volumes:
  #     - /path/to/your/music:/data/music:ro
