# Docker Compose local override (EXAMPLE)
#
# Copy to `docker-compose.override.yml` (gitignored) and adjust paths for
# your machine. Docker Compose auto-meres this file with docker-compose.yml
# on `docker compose up`.
#
# This template shows the four common dev customizations:
#   1. Bind-mount your existing music library instead of the named volume
#   2. Bind-mount the NicotinD data dir (secrets, DB) for persistence
#   3. Build the server image from source instead of pulling from GHCR
#   4. Enable GPU passthrough for the analysis sidecar
#
# See docker-compose.yml for the full service definitions this overrides.

services:
  nicotind:
    # Build from the working tree instead of pulling the published image
    # (development, or a fork with no registry). With both `image:` and
    # `build:` set, `docker compose up --build` builds and tags the result
    # under the image name.
    build: .
    volumes:
      - ~/.nicotind:/data/nicotind
      - /path/to/your/music:/data/music

  analysis:
    build:
      context: packages/analysis
      args:
        GPU: "1"
    volumes:
      - /path/to/your/music:/data/music:ro
    # `deploy.resources.reservations.devices` is the modern way to ask the
    # host's nvidia-container-runtime for GPU access. The image keeps its
    # full CPU fallback so omitting the block still runs (just slower).
    # Important: on hosts whose nvidia runtime is in *legacy* mode (the
    # default on older toolkit installs) this triggers a bind-mount of
    # /run/nvidia-persistenced/socket. If `nvidia-persistenced` is not
    # running on the host, the container fails to start with:
    #   failed to fulfil mount request:
    #   open /run/nvidia-persistenced/socket: no such file or directory
    # Fix on the host:  sudo systemctl enable --now nvidia-persistenced
    # Or switch to CDI: sudo nvidia-ctk config --in-place \
    #                       --set nvidia-container-runtime.mode=cdi
    # See docs/deployment.md "GPU passthrough on the host" for details.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  slskd:
    volumes:
      - /path/to/your/music:/data/music
    ports:
      - "5030:5030"

  lidarr:
    volumes:
      - /path/to/your/music:/data/music